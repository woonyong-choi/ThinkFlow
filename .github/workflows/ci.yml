name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run check:docs
      - run: npm run check:sources
      - run: npm run check:figures
      # 좁은 화면 HTML의 자연 글자 크기·가로 스크롤·삽입 높이(#272). ubuntu-latest에 설치된 Chrome을 쓴다.
      - if: matrix.node == 22
        run: npm run test:browser
      - name: Check installed npm package
        run: npm run check:package -- "$RUNNER_TEMP/torso-package"

  # 저장소 루트 action.yml을 이 저장소에서 한 번 써서 동작을 확인한다. 추적하는 모든 .torso와 .md(기본 paths)를 보므로 원본에 오류나 경고가 있거나 마크다운 그림이 낡으면 실패한다.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          mode: check
          strict: 'true'

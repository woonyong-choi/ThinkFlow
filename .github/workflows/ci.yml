name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: node src/cli.js check examples/*.muto docs/assets/*.muto --strict

  # 저장소 루트 action.yml을 이 저장소에서 한 번 써서 동작을 확인한다. 마크다운 그림이 낡으면 실패한다.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          paths: docs/design/markdown.md docs/assets/*.muto
          mode: check
          strict: 'true'

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run check:sources
      - run: npm run check:figures
      - name: Check installed npm package
        run: npm run check:package -- "$RUNNER_TEMP/daphnis-package"

  # 저장소 루트 action.yml을 이 저장소에서 한 번 써서 동작을 확인한다. 추적하는 모든 .dap와 .md(기본 paths)를 보므로 원본에 오류나 경고가 있거나 마크다운 그림이 낡으면 실패한다.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          mode: check
          strict: 'true'

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>orders</title>
<script>if (window.self !== window.top) {
  document.documentElement.classList.add('embedded');
  addEventListener('message', (e) => {
    if (e.source !== parent || !e.data || !('theme' in e.data)) return;
    const root = document.documentElement;
    if (e.data.theme === 'light' || e.data.theme === 'dark') {
      root.setAttribute('data-theme', e.data.theme);
      root.style.colorScheme = e.data.theme;
    } else {
      root.removeAttribute('data-theme');
      root.style.colorScheme = '';
    }
  });
  parent.postMessage({ themeRequest: true }, '*');
  addEventListener('load', () => new ResizeObserver(() => parent.postMessage({ figureHeight: Math.ceil(document.body.getBoundingClientRect().height) }, '*')).observe(document.body));
}</script>

  --color-figure-icon: var(--color-palette-blue-450);

  --color-ui-focus: var(--color-palette-blue-400);

/* 조작 단추의 공통 모양과 상태. 재생기(원 단추, 탭), 목록 쪽과 문서 미리보기(테마 묶음)가 모두 이 파일 하나를 쓴다. */
.fl-round:hover,
.fl-tabs button:hover,
.theme button:hover {
  color: var(--color-fg);
}

.fl-round:focus-visible,
.fl-tabs button:focus-visible,
.theme button:focus-visible {
  outline: var(--border-tag) solid var(--color-ui-focus);
  outline-offset: var(--space-1);
}

/* 분할 조작(재생기 탭, 테마 묶음)과 둥근 단추는 한 모양이다. 바깥 높이 control, 안쪽 단추 높이 control-inner, 반지름 full. */
.fl-tabs,
.theme {
  display: flex;
  box-sizing: border-box;
  min-height: var(--size-control-outer);
  padding: var(--space-1-5);
  background: var(--color-bg);
  border: var(--border-thin) solid var(--color-border);
  border-radius: var(--radius-full);
}

.fl-tabs button,
.theme button {
  min-height: var(--size-control-inner);
  font: var(--size-text-13) var(--font-sans);
  color: var(--color-muted);
  cursor: pointer;
  background: transparent;
  border: 0;
  border-radius: var(--radius-full);
}

.theme button {
  padding: 0 var(--space-6);
}

/* segmented 방식: 켜진 항목은 꽉 찬 알약(ui.control-on)이다. 켜짐 표시는 묶음 바탕과 대비 3인 border 색 고리다. */
.fl-tabs button.on,
.theme button[aria-pressed='true'] {
  font-weight: var(--weight-semibold);
  color: var(--color-fg);
  background: var(--color-ui-control-on);
  box-shadow: 0 0 0 var(--border-thin) var(--color-border);
}
/* 재생기 틀과 조작 막대. iframe 안(html.embedded)에서는 테두리와 바깥 여백을 뺀다. */
/* 그림 표시 폭 규칙: 문서 미리보기, 목록 카드, 재생기가 같다. 컨테이너 폭은 화면 폭에서 좌우 바깥 여백(space-16)을 뺀 값이고,
   그림 폭은 min(표준 캔버스 폭, 컨테이너 폭)이다. 컨테이너 안쪽에는 좌우 여백과 레이아웃을 차지하는 테두리를 두지 않아 세 곳의 그림 폭이 같다. */
body {
  margin: 0;
  padding: var(--space-12) var(--space-16);
  font-family: var(--font-sans);
  color: var(--color-fg);
  background: var(--color-page);
}

/* 목록 쪽 카드 안은 틀이 카드 너비를 다 채워 양옆이 비치지 않게 하고, 바탕은 재생기 쪽과 같은 색으로 둔다. */
html.embedded body {
  padding: 0;
  background: var(--color-bg);
}

.fl-figure {
  position: relative;
  max-width: var(--figure-canvas, var(--size-figure-canvas));
  margin: 0 auto;
  overflow: clip;
  color: var(--color-fg);
  background: var(--color-bg);
  border-radius: var(--radius-2xl);
  box-shadow: 0 0 0 var(--border-thin) var(--color-plate-border);
}

html.embedded .fl-figure {
  max-width: none;
  border-radius: 0;
  box-shadow: none;
}

/* 카드 전체가 그림 판 한 덩어리다. 제목 줄, 그림 영역, 조작 줄이 모두 color.bg 한 톤이라 숫자 둘레 halo와 선 라벨 알약도 그대로 맞는다. */
.fl-canvas {
  padding: var(--space-6) 0;
  background: var(--color-bg);
  overflow: auto;
}

/* 그림은 표준 캔버스 폭 아래로 줄이지 않는다. 화면 높이에 맞춰 줄이지도 않는다. 세로로 긴 그림은 페이지가 길어지고(조작 막대는 화면 아래에 붙어 따라온다),
   화면 폭이 캔버스 폭보다 좁으면 그림 영역이 가로로 스크롤된다. 줄이면 글자가 가장 작은 글 토큰(size.text.9)보다 작아져 읽히지 않기 때문이다. */
.fl-canvas svg {
  display: block;
  width: auto;
  height: auto;
  min-width: var(--figure-canvas, var(--size-figure-canvas));
  margin: 0 auto;
}

/* 조작 막대와 설명 줄은 한 가운데 축을 쓴다. 위아래 안쪽 여백이 같고, 막대와 설명 사이는 한 칸(space-6)이다. */
.fl-foot {
  position: sticky;
  bottom: 0;
  z-index: var(--z-raised);
  display: grid;
  gap: var(--space-6);
  justify-items: center;
  padding: var(--space-8);
  background: var(--color-bg);
  border-top: var(--border-thin) solid var(--color-plate-border);
}

/* 양쪽 칸 너비가 같아(1fr) 배속 글자가 바뀌어도 탭 묶음이 설명과 같은 축에 있다. */
.fl-bar {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: var(--space-5);
  align-items: center;
}

.fl-bar .fl-pause {
  justify-self: end;
}

.fl-bar .fl-rate {
  justify-self: start;
}

/* 현재 탭의 진행은 일시정지 단추 테두리 위를 12시에서 시계 방향으로 도는 진행(ui.progress) 고리다. 트랙은 단추 테두리 그대로다. */
.fl-pause {
  position: relative;
}

.fl-ring {
  position: absolute;
  inset: calc(-1 * var(--border-thin));
  width: calc(100% + 2 * var(--border-thin));
  height: calc(100% + 2 * var(--border-thin));
  pointer-events: none;
}

.fl-ring-fill {
  fill: none;
  stroke: var(--color-ui-progress);
}

.fl-pause-icon {
  display: grid;
  place-items: center;
}

.fl-round {
  display: grid;
  place-items: center;
  min-width: var(--size-control-outer);
  height: var(--size-control-outer);
  padding: 0 var(--space-2);
  font: var(--size-text-13) var(--font-sans);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  color: var(--color-muted);
  background: var(--color-node);
  border: var(--border-thin) solid var(--color-border);
  border-radius: var(--radius-full);
  cursor: pointer;
}

.fl-tabs {
  flex-wrap: wrap;
  gap: var(--space-1);
  justify-content: center;
}

.fl-tabs button {
  position: relative;
  display: grid;
  place-items: center;
  padding: 0 var(--space-7);
}

/* 백틱으로 감싼 글. 코드 글꼴로 그린다. */
.fl-code {
  font-family: var(--font-mono);
}

.fl-caption {
  max-width: var(--size-player-caption-max);
  min-height: calc(var(--size-text-13) * var(--leading-normal));
  margin: 0;
  font-size: var(--size-text-13);
  line-height: var(--leading-normal);
  text-align: center;
  color: var(--color-muted);
}

.fl-full {
  position: absolute;
  top: var(--space-5);
  right: var(--space-5);
  z-index: var(--z-raised);
}

.fl-figure.full {
  position: fixed;
  inset: 0;
  z-index: var(--z-overlay);
  display: flex;
  flex-direction: column;
  max-width: none;
  border-radius: 0;
}

.fl-figure.full .fl-canvas {
  display: grid;
  flex: 1;
  place-items: center;
}

.fl-figure.full .fl-canvas svg {
  width: 100%;
  min-width: 0;
  height: calc(100vh - var(--size-player-embedded-chrome));
  max-height: none;
  touch-action: none;
  user-select: none;
}

.fl-figure.full.zoomed .fl-canvas svg {
  cursor: grab;
}

.fl-figure.full.zoomed .fl-canvas svg:active {
  cursor: grabbing;
}

/* 확대·축소는 전체 화면에서만 보인다. 문서 안에서는 그림을 그대로 보이는 편이 읽기 쉽다. */
.fl-zoom {
  position: absolute;
  top: calc(var(--space-5) + var(--size-control-outer) + var(--space-3));
  right: var(--space-5);
  z-index: var(--z-raised);
  display: none;
  flex-direction: column;
  gap: var(--space-3);
}

.fl-figure.full .fl-zoom {
  display: flex;
}

.fl .fl-node.on .fl-stroke {
  stroke: var(--color-state-active);
  stroke-width: var(--border-strong);
}

.fl .fl-card.on {
  fill: var(--color-card-on);
  stroke: var(--color-state-active);
}

.fl .fl-edge.on .fl-path,
.fl .fl-edge.hover .fl-path {
  stroke: var(--color-state-active);
  stroke-width: var(--border-strong);
}

.fl .fl-edge.on .fl-path[marker-end],
.fl .fl-edge.hover .fl-path[marker-end] {
  marker-end: url("#fl-arrow-on");
}

.fl .fl-edge.on .fl-path[marker-start],
.fl .fl-edge.hover .fl-path[marker-start] {
  marker-start: url("#fl-arrow-on");
}

.fl .fl-edge.on .fl-pill rect {
  fill: var(--color-state-active-fill);
  stroke: var(--color-state-active-fill);
}

.fl .fl-edge.on .fl-pill text {
  fill: var(--color-state-on-active);
}

.fl .fl-path,
.fl .fl-stroke,
.fl .grid-cell,
.fl .fl-pill rect {
  transition: stroke var(--duration-fast), stroke-width var(--duration-fast), fill var(--duration-fast);
}

.fl .fl-layer,
.fl .fl-edge.quiet {
  transition: opacity var(--duration-fast);
}

/* 조용한 선은 지금 단계에서 쓰거나 마우스를 올린 도형에 닿을 때만 보인다. */
.fl .fl-edge.quiet:not(.on, .hover) {
  opacity: 0;
}

.fl .fl-node {
  cursor: default;
}

.fl-packet {
  pointer-events: none;
}

@media (prefers-reduced-motion: reduce) {
  .fl .fl-path,
  .fl .fl-stroke,
  .fl .grid-cell,
  .fl .fl-pill rect,
  .fl .fl-layer,
  .fl .fl-edge.quiet {
    transition: none;
  }
}

.fl .fl-group.on .fl-stroke {
  stroke: var(--color-state-active);
  stroke-width: var(--border-strong);
}

.fl .fl-part.on .part-bg {
  fill: var(--color-card-on);
}

.fl .fl-part.on .grid-cell {
  fill: var(--color-card-on);
  stroke: var(--color-state-active);
  stroke-width: var(--border-edge);
}

/* hidden 속성이 display: grid 같은 규칙에 지지 않게 한다. 시간 흐름 없는 그림의 빈 조작 막대를 숨기기 위해서다. */
[hidden] {
  display: none !important;
}
/* 그림 안 글자와 모양. HTML 재생기와 움직이는 SVG가 같이 쓴다. */
.fl text {
  font-family: var(--font-sans);
}

.fl .label {
  font-size: var(--size-text-13);
  font-weight: var(--weight-medium);
  text-anchor: middle;
  fill: var(--color-fg);
}

.fl .sub {
  font-size: var(--size-text-11);
  text-anchor: middle;
  fill: var(--color-muted);
}

.fl .frame {
  font-size: var(--size-text-11);
  font-weight: var(--weight-semibold);
  letter-spacing: var(--tracking-frame);
  fill: var(--color-muted);
}

.fl .edgelabel {
  font-size: var(--size-text-11);
  text-anchor: middle;
  fill: var(--color-muted);
}

.fl .row {
  font-size: var(--size-text-11);
  fill: var(--color-fg);
}

.fl .row.mono {
  font-family: var(--font-mono);
  font-size: var(--size-text-11);
}

/* 백틱으로 감싼 글. 코드 글꼴로 그린다. */
.fl .code {
  font-family: var(--font-mono);
}

.fl .muted {
  fill: var(--color-muted);
}

.fl .tag {
  font-size: var(--size-text-9);
  font-weight: var(--weight-semibold);
  letter-spacing: var(--tracking-tag);
  text-anchor: middle;
  fill: var(--color-fg);
}

.fl .mark {
  font-size: var(--size-text-11);
  font-weight: var(--weight-semibold);
  text-anchor: end;
  fill: var(--color-state-active-text);
}

.fl .mini {
  font-size: var(--size-text-11);
  text-anchor: middle;
  fill: var(--color-fg);
}

.fl .mini.on {
  fill: var(--color-state-on-active);
}

.fl .chip {
  font-size: var(--size-text-11);
  text-anchor: middle;
  fill: var(--color-state-on-active);
}

.fl .cell {
  font-size: var(--size-text-13);
  fill: var(--color-fg);
}

.fl .item {
  font-size: var(--size-text-13);
  text-anchor: middle;
  fill: var(--color-fg);
}

.fl .item.gap {
  fill: var(--color-muted);
}

.fl .cell.type {
  font-family: var(--font-mono);
  font-size: var(--size-text-11);
  text-anchor: end;
  fill: var(--color-muted);
}

.fl .fl-stroke {
  stroke: var(--color-border);
  stroke-width: var(--border-thin);
}

.fl .fl-path {
  fill: none;
  stroke: var(--color-muted);
  stroke-width: var(--border-edge);
}

.fl .cell .key {
  font-size: var(--size-text-9);
  font-weight: var(--weight-semibold);
  fill: var(--color-muted);
}

.fl .frame-box {
  fill: var(--color-group);
  stroke: var(--color-border);
}

.fl .lifeline {
  stroke: var(--color-border);
  stroke-width: var(--border-lifeline);
  stroke-dasharray: var(--dash-gap) var(--dash-gap);
}

.fl .note-box {
  fill: var(--color-surface);
  stroke: var(--color-border);
  stroke-dasharray: var(--dash-card) var(--dash-card);
}

.fl .pill {
  fill: var(--color-bg);
  stroke: var(--color-border);
}

.fl .part-bg {
  fill: transparent;
}

.fl .col-line {
  stroke: var(--color-border);
  stroke-width: var(--border-hair);
}

.fl .grid-cell {
  fill: var(--color-node);
  stroke: var(--color-border);
  stroke-width: var(--border-thin);
}

.fl .grid-cell.gap {
  fill: var(--color-surface);
  stroke-dasharray: var(--dash-card) var(--dash-card);
}

.fl .grid-cell.empty {
  fill: none;
  stroke-dasharray: var(--dash-card) var(--dash-card);
}

.fl .fl-edge.mark .fl-path {
  stroke: var(--color-fg);
}

/* 도형 윗줄과 그룹 제목 줄의 장식: 글자 배지, 아이콘 */
.fl .badge {
  font-size: var(--size-text-11);
  font-weight: var(--weight-semibold);
  text-anchor: middle;
  fill: var(--color-fg);
}

.fl .badge-pill {
  fill: var(--color-node);
  stroke: var(--color-border);
  stroke-width: var(--border-thin);
}

.fl .fl-icon {
  color: var(--color-figure-icon);
}

/* 그룹 제목 줄 탭(NHN box_type): 틀 왼쪽 위 모서리의 정사각 면. 아이콘 색 파랑 면에 노드 면 색 아이콘이고, 아이콘이 있는 그룹의 틀도 같은 파랑이다. */
.fl .group-tab {
  fill: var(--color-figure-icon);
}

.fl .fl-icon.on-tab {
  color: var(--color-node);
}

.fl .fl-group.tabbed:not(.on) .frame-box {
  stroke: var(--color-figure-icon);
}

/* 선 번호 원. 라벨 알약과 달리 켜져도 색이 바뀌지 않아 정지 그림과 같은 순서로 읽힌다. */
.fl .number-pill {
  fill: var(--color-fg);
}

.fl .number {
  font-size: var(--size-text-11);
  font-weight: var(--weight-semibold);
  text-anchor: middle;
  fill: var(--color-bg);
}
/* 차트 글자와 자라는 움직임. 차트 SVG 안에 들어가고, README 이미지에서도 보이게 되풀이한다. */
.fl .chart-title {
  font-size: var(--size-text-15);
  font-weight: var(--weight-semibold);
  fill: var(--color-fg);
}

.fl .chart-label {
  font-size: var(--size-text-13);
  font-weight: var(--weight-medium);
  fill: var(--color-fg);
}

.fl .chart-value,
.fl .chart-tick,
.fl .chart-unit {
  font-variant-numeric: tabular-nums;
  font-size: var(--size-text-11);
  fill: var(--color-muted);
}

.fl .chart-value {
  fill: var(--color-fg);
}

/* 값 글자와 점 이름은 뒤의 격자와 기준선이 글자 둘레에서 끊기게 바탕색 테두리를 두른다. */
.fl .chart-value,
.fl .chart-name {
  paint-order: stroke;
  stroke: var(--color-bg);
  stroke-width: var(--border-halo);
  stroke-linejoin: round;
}

.fl .chart-tick {
  text-anchor: middle;
}

.fl .chart-unit {
  text-anchor: end;
}

.fl .chart-value.start {
  text-anchor: start;
}

.fl .chart-value.end {
  text-anchor: end;
}

/* 값 글자는 계열과 상관없이 글자색이다. 계열은 막대, 점, 띠 색으로만 전하고 강조 계열(ours, second)은 굵기로만 구분한다. */
.fl .chart-value.ours,
.fl .chart-value.second {
  font-weight: var(--weight-semibold);
}

.fl .chart-name.end {
  text-anchor: end;
}

.fl .chart-missing {
  font-size: var(--size-text-11);
  font-style: italic;
  fill: var(--color-muted);
}

.fl .chart-ratio {
  font-variant-numeric: tabular-nums;
  font-size: var(--size-text-13);
  font-weight: var(--weight-semibold);
  text-anchor: end;
  fill: var(--color-fg);
}

.fl .chart-legend,
.fl .chart-sub,
.fl .chart-name,
.fl .chart-rule-label {
  font-size: var(--size-text-11);
  fill: var(--color-muted);
}

.fl .chart-tick.end,
.fl .chart-rule-label.end {
  text-anchor: end;
}

.fl .chart-unit.start {
  text-anchor: start;
}

/* 칸 색은 변수로 계산해 다크 모드 heat-low를 따라간다. --s는 칸 강도(0~1)다. */
.fl .chart-heat {
  fill: color-mix(in srgb, var(--color-data-heat-high) calc(var(--s) * 100%), var(--color-data-heat-low));
}

.fl .chart-cell {
  --ink: var(--color-data-heat-ink);
  font-variant-numeric: tabular-nums;
  font-size: var(--size-text-11);
  text-anchor: middle;
  fill: var(--ink);
}

.fl .chart-cell.on {
  --ink: var(--color-data-heat-ink-on);
}

/* 흐린 칸은 면이 바탕 쪽으로 옅어져 진한 칸의 밝은 글자가 묻힌다. 흐린 동안은 모든 칸이 어두운 글자(다크는 같은 밝은 글자)다. */
.fl .chart-cell.dim {
  fill: var(--color-data-heat-ink);
}

.fl .chart-axis,
.fl .chart-grid {
  stroke: var(--color-data-grid);
  stroke-width: var(--border-thin);
}

.fl .chart-rule {
  stroke: var(--color-muted);
  stroke-width: var(--border-thin);
  stroke-dasharray: var(--dash-line) var(--dash-gap);
}

.fl .chart-whisker,
.fl .chart-median {
  stroke: var(--color-fg);
  stroke-width: var(--border-tag);
}

.fl .chart-ci {
  stroke: var(--color-fg);
  stroke-width: var(--border-tag);
}

.fl .chart-ci-casing {
  stroke: var(--color-bg);
  stroke-width: var(--border-casing);
}

.fl .chart-interval {
  fill: none;
  stroke: var(--color-muted);
  stroke-width: var(--border-edge);
}

.fl .chart-band {
  fill-opacity: var(--opacity-band);
}

.fl .chart-range {
  stroke-linecap: round;
  stroke-opacity: var(--opacity-range);
}

.fl .chart-after {
  stroke: var(--color-bg);
  stroke-width: var(--border-tag);
}

.fl .chart-box {
  fill: var(--color-node);
  stroke: var(--color-data-main);
  stroke-width: var(--border-tag);
}

.fl .chart-before {
  fill: var(--color-bg);
  stroke: var(--color-data-compare);
  stroke-width: var(--border-tag);
}

.fl .chart-arrow,
.fl .chart-link {
  stroke: var(--color-data-main);
  stroke-width: var(--border-strong);
}

.fl .chart-link {
  stroke: var(--color-muted);
  stroke-width: var(--border-strong);
  stroke-linecap: round;
}

.fl .chart-label.shift {
  transform: translateY(var(--label-shift));
  transition: transform var(--duration-fast);
}

/* pathLength 1인 선이 stroke-dashoffset으로 그려진다. 선 차트의 선, 덤벨 화살표, 산점도 link가 함께 쓴다. */
.fl .draw {
  stroke-dasharray: 1;
}

.fl .grow {
  transform-box: fill-box;
  transform-origin: left center;
}

.fl .hidden {
  opacity: 0;
}

.fl .dim {
  opacity: var(--opacity-dim);
}

/* 글자는 면보다 덜 흐려, 흐린 행에서도 글자가 바탕과 대비 4.5 이상이다(opacity.dim-ink). */
.fl .ink.dim {
  opacity: var(--opacity-dim-ink);
}

.fl .cs-0,
.fl .cs-1,
.fl [class*="cr-"] {
  transition: opacity var(--duration-fast);
}

/* 면이 바탕 쪽으로 옅어지는 중간에는 밝은 글자와 어두운 글자 모두 대비 4.5에 못 미친다. 칸 면과 글자는 서서히 가지 않고 한꺼번에 바뀐다. */
.fl .chart-heat-cell,
.fl .chart-cell.ink {
  transition: none;
}
</style>
</head>
<body>
<figure class="fl-figure" tabindex="0">

<div class="fl-canvas"><svg xmlns="http://www.w3.org/2000/svg" class="fl" width="960" height="186" style="aspect-ratio: 960 / 186" viewBox="-240.1 0 960 186" role="img"><title>orders</title><defs><marker id="fl-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="var(--color-muted)"/></marker><marker id="fl-arrow-on" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="var(--color-state-active)"/></marker><marker id="fl-arrow-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="var(--color-data-main)"/></marker></defs><g id="n-0" class="fl-node" data-id="payments"><rect x="28" y="28" width="221.2" height="104" rx="10" fill="var(--color-node)" class="fl-stroke "/><text x="138.6" y="45.7" class="label">payments</text><g class="fl-part" data-part="payments.id"><rect x="29" y="54" width="219.2" height="26" class="part-bg "/><line x1="28" x2="249.2" y1="54" y2="54" class="col-line"/><text x="46" y="71.7" class="cell">id<tspan class="key" dx="6">PK</tspan></text><text x="231.2" y="71.7" class="cell type">bigint</text></g><g class="fl-part" data-part="payments.order_id"><rect x="29" y="80" width="219.2" height="26" class="part-bg "/><line x1="28" x2="249.2" y1="80" y2="80" class="col-line"/><text x="46" y="97.7" class="cell">order_id<tspan class="key" dx="6">FK</tspan></text><text x="231.2" y="97.7" class="cell type">bigint</text></g><g class="fl-part" data-part="payments.amount"><rect x="29" y="106" width="219.2" height="26" class="part-bg "/><line x1="28" x2="249.2" y1="106" y2="106" class="col-line"/><text x="46" y="123.7" class="cell">amount</text><text x="231.2" y="123.7" class="cell type">numeric(10, 2)</text></g></g>
<g id="n-1" class="fl-node" data-id="orders"><rect x="309.2" y="54" width="142.7" height="104" rx="10" fill="var(--color-node)" class="fl-stroke "/><text x="380.5" y="71.7" class="label">orders</text><g class="fl-part" data-part="orders.id"><rect x="310.2" y="80" width="140.7" height="26" class="part-bg "/><line x1="309.2" x2="451.9" y1="80" y2="80" class="col-line"/><text x="327.2" y="97.7" class="cell">id<tspan class="key" dx="6">PK</tspan></text><text x="433.9" y="97.7" class="cell type">bigint</text></g><g class="fl-part" data-part="orders.user_id"><rect x="310.2" y="106" width="140.7" height="26" class="part-bg "/><line x1="309.2" x2="451.9" y1="106" y2="106" class="col-line"/><text x="327.2" y="123.7" class="cell">user_id</text><text x="433.9" y="123.7" class="cell type">bigint</text></g><g class="fl-part" data-part="orders.status"><rect x="310.2" y="132" width="140.7" height="26" class="part-bg "/><line x1="309.2" x2="451.9" y1="132" y2="132" class="col-line"/><text x="327.2" y="149.7" class="cell">status</text><text x="433.9" y="149.7" class="cell type">varchar</text></g></g>

<script>
// 브라우저에서 돈다(play.js와 한 스크립트로 이어 붙는다).
// 전체 화면과, 전체 화면에서만 켜지는 확대·축소·끌어 옮기기를 맡는다. 문서 안에서는 그림을 그대로 보인다.

const VIEW_ICONS = {
  open: 'M2 6V2h4M14 6V2h-4M2 10v4h4M14 10v4h-4',
  close: 'M6 2v4H2M10 2v4h4M6 14v-4H2M10 14v-4h4',
  in: 'M8 3v10M3 8h10',
  out: 'M3 8h10',
  fit: 'M3 3h10v10H3z',
};

// cost: time O(1) 시작, 휠·끌기마다 O(1), heap O(1), stack O(1)
// basis: estimate
/**
 * 그림 틀에 전체 화면 단추와 확대·축소를 붙인다.
 * @param root `.fl-figure` 요소. 안에 `.fl-full`, `.fl-zoom` 단추와 `svg.fl`이 있다
 * @param metrics { icon, iconStroke, zoomMax, zoomStep }
 */
function figureView(root, metrics) {
  const svg = root.querySelector('svg.fl');
  const base = svg.viewBox.baseVal;
  const home = { x: base.x, y: base.y, w: base.width, h: base.height };
  // 보는 상태 한 덩어리. view는 지금 viewBox, drag는 끄는 중인 손짓이다.
  const viewer = { root, svg, metrics, home, view: { ...home }, drag: undefined, fullButton: root.querySelector('.fl-full') };
  bindFull(viewer);
  bindZoom(viewer);
  bindPan(viewer);
  showFull(viewer, false);
}

// cost: time O(1), heap O(1), stack O(1)
// basis: estimate
function bindFull(viewer) {
  const { root, fullButton } = viewer;
  fullButton.addEventListener('click', () => setFull(viewer, !root.classList.contains('full')));
  document.addEventListener('fullscreenchange', () => showFull(viewer, document.fullscreenElement === root));
  root.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !document.fullscreenElement) setFull(viewer, false);
  });
}

// cost: time O(b), heap O(1), stack O(1)
// vars: b = 확대·축소 단추 수
// basis: estimate
function bindZoom(viewer) {
  const { root, metrics, home } = viewer;
  root.querySelectorAll('.fl-zoom button').forEach((b) => {
    b.innerHTML = drawViewIcon(metrics, VIEW_ICONS[b.dataset.zoom]);
    b.addEventListener('click', () => (b.dataset.zoom === 'fit' ? setView(viewer, home) : zoomAt(viewer, b.dataset.zoom === 'in' ? metrics.zoomStep : 1 / metrics.zoomStep)));
  });
}

// cost: time O(1), heap O(1), stack O(1)
// basis: estimate
function bindPan(viewer) {
  const { svg } = viewer;
  svg.addEventListener('wheel', (e) => onWheel(viewer, e), { passive: false });
  svg.addEventListener('pointerdown', (e) => onPointerDown(viewer, e));
  svg.addEventListener('pointermove', (e) => onPointerMove(viewer, e));
  for (const type of ['pointerup', 'pointercancel', 'lostpointercapture']) svg.addEventListener(type, () => (viewer.drag = undefined));
}

// 브라우저 전체 화면을 먼저 쓰고, 막혀 있으면(iframe에 allowfullscreen이 없을 때 등) 창을 덮는 모양으로 대신한다.
function setFull(viewer, isFull) {
  const { root } = viewer;
  const canUseApi = Boolean(root.requestFullscreen) && document.fullscreenEnabled;
  if (!canUseApi) return showFull(viewer, isFull);
  if (isFull) root.requestFullscreen().catch(() => showFull(viewer, true));
  else if (document.fullscreenElement) document.exitFullscreen();
  else showFull(viewer, false);
}

function showFull(viewer, isFull) {
  const { root, fullButton, metrics, home } = viewer;
  root.classList.toggle('full', isFull);
  fullButton.innerHTML = drawViewIcon(metrics, isFull ? VIEW_ICONS.close : VIEW_ICONS.open);
  const label = isFull ? '전체 화면 끝내기' : '전체 화면';
  fullButton.setAttribute('aria-label', label);
  fullButton.title = label;
  // 문서 안에서는 늘 전체 그림을 보인다.
  if (!isFull) setView(viewer, home);
}

// cost: time O(1), heap O(1), stack O(1)
// basis: estimate
// 휠을 굴린 자리를 중심으로 확대한다. 전체 화면이 아닐 때는 문서 스크롤에 맡긴다.
function onWheel(viewer, e) {
  if (!viewer.root.classList.contains('full')) return;
  e.preventDefault();
  // 가로로만 미는 손짓은 확대·축소가 아니다.
  if (e.deltaY === 0) return;
  const { zoomStep } = viewer.metrics;
  zoomAt(viewer, e.deltaY < 0 ? zoomStep : 1 / zoomStep, toSvgPoint(viewer.svg, e));
}

// cost: time O(1), heap O(1), stack O(1)
// basis: estimate
function onPointerDown(viewer, e) {
  const { root, svg, view, home } = viewer;
  const isMainButton = e.button === 0;
  if (!root.classList.contains('full') || view.w >= home.w || !isMainButton) return;
  // 끄는 동안 viewBox가 바뀌므로, 잡은 순간의 화면→그림 변환으로 거리를 잰다.
  viewer.drag = { start: toSvgPoint(svg, e), matrix: svg.getScreenCTM().inverse(), view: { ...view } };
  svg.setPointerCapture(e.pointerId);
}

// cost: time O(1), heap O(1), stack O(1)
// basis: estimate
// 끈 거리만큼 그림을 반대로 옮긴다. 잡은 자리가 손가락 아래에 머문다.
function onPointerMove(viewer, e) {
  const { drag } = viewer;
  if (!drag) return;
  const now = new DOMPoint(e.clientX, e.clientY).matrixTransform(drag.matrix);
  setView(viewer, { ...drag.view, x: drag.view.x - (now.x - drag.start.x), y: drag.view.y - (now.y - drag.start.y) });
}

// factor만큼 확대한다. 배율은 1배(전체)에서 metrics.zoomMax배 사이다.
function zoomAt(viewer, factor, center = { x: viewer.view.x + viewer.view.w / 2, y: viewer.view.y + viewer.view.h / 2 }) {
  const { view, home, metrics } = viewer;
  const w = Math.min(home.w, Math.max(home.w / metrics.zoomMax, view.w / factor));
  const k = w / view.w;
  setView(viewer, { x: center.x - (center.x - view.x) * k, y: center.y - (center.y - view.y) * k, w, h: view.h * k });
}

// cost: time O(1), heap O(1), stack O(1)
// basis: estimate
// 그림 밖으로 벗어나지 않게 자리를 막고 viewBox에 쓴다.
function setView(viewer, next) {
  const { home, svg, root } = viewer;
  const x = Math.min(home.x + home.w - next.w, Math.max(home.x, next.x));
  const y = Math.min(home.y + home.h - next.h, Math.max(home.y, next.y));
  viewer.view = { ...next, x, y };
  svg.setAttribute('viewBox', `${x} ${y} ${next.w} ${next.h}`);
  root.classList.toggle('zoomed', next.w < home.w);
}

// 화면 좌표를 그림 좌표로 바꾼다. 그림 비율과 svg 상자 비율이 달라 생기는 여백까지 브라우저 변환 행렬이 반영한다.
function toSvgPoint(svg, e) {
  const point = new DOMPoint(e.clientX, e.clientY).matrixTransform(svg.getScreenCTM().inverse());
  return { x: point.x, y: point.y };
}

function drawViewIcon(metrics, d) {
  return `<svg width="${metrics.icon}" height="${metrics.icon}" viewBox="0 0 16 16"><path d="${d}" fill="none" stroke="currentColor" stroke-width="${metrics.iconStroke}" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

// 브라우저에서 돈다. html.js가 HTML 안에 그대로 넣는다(src/player/ 파일을 이어 붙인다).
// 시간표의 박자 상태를 그대로 그린다. 상태를 다시 계산하지 않는다(docs/architecture.md 불변 조건).
// 이 파일은 재생기 본체다: 시작, 시계, 박자 이동, 설명 글. 역할별로 파일이 나뉜다: 단추와 탭과 진행 고리(controls.js), 그림 그리기(stage.js), 이동 곡선(curve.js), 전체 화면과 확대(view.js).

const PLAYER_RATES = [1, 2, 0.5];
// 설명 글이 바뀔 때 앞 글이 사라지고 뒤 글이 나타나는 각 시간(ms)을 담은 토큰 변수. 움직이는 SVG와 같은 토큰이다.
const CAPTION_FADE_VAR = '--duration-caption-fade';

// cost: time O(s + c) 시작, 프레임마다 O(h + k), heap O(s + c), stack O(1)
// vars: s = 도형 수, c = 선 수, h = 한 박자의 이동 수, k = 카드 있는 도형 수
// basis: estimate
/**
 * 재생기를 붙인다.
 * @param root `.fl-figure` 요소
 * @param data { segs, steps, cardCounts, edgeEnds, seriesCount, rowCount, metrics }
 */
function figurePlay(root, data) {
  const player = createPlayer(root, data);
  bindControls(root, player);
  highlightOnHover(player.stage);
  figureView(root, data.metrics);
  centerCanvas(root);
  setPlaying(player, player.clock.isPlaying);
  if (data.segs.length) {
    enterSegment(player, 0);
    requestAnimationFrame(player.tick);
  } else {
    // 시간 흐름이 없는 그림은 조작 막대를 숨긴다. 차트는 SVG 이미지처럼 되풀이해 자란다.
    root.querySelector('.fl-foot').hidden = true;
    player.stage.svg.classList.add('chart-loop');
  }
}

// cost: time O(1), heap O(1), stack O(1)
// basis: estimate
// 화면이 표준 캔버스 폭보다 좁으면 그림 영역이 가로로 스크롤된다. 내용이 캔버스보다 좁은 그림은 내용이 캔버스 가운데에 있으므로 가운데에서 시작하고(viewBox 왼쪽이 음수),
// 캔버스를 꽉 채우는 차트와 넓은 그림은 왼쪽 끝(이름과 축)에서 시작한다. 화면 크기가 바뀌어도 다시 맞춘다.
function centerCanvas(root) {
  const canvas = root.querySelector('.fl-canvas');
  const isCentered = root.querySelector('svg.fl').viewBox.baseVal.x < 0;
  const place = () => {
    canvas.scrollLeft = isCentered ? (canvas.scrollWidth - canvas.clientWidth) / 2 : 0;
  };
  place();
  addEventListener('resize', place);
}

// cost: time O(s + c), heap O(s + c), stack O(1)
// vars: s = 도형 수, c = 선 수
// basis: estimate
// 재생기 상태 한 덩어리. 시계, 그림, 탭, 고리, 설명 줄이 이 객체 하나로 이어진다.
function createPlayer(root, data) {
  const pauseButton = root.querySelector('.fl-pause');
  const player = {
    data,
    stage: createStage(root, data),
    clock: createClock(),
    stepSegs: data.steps.map((_, si) => data.segs.filter((s) => s.si === si)),
    hasCaption: data.segs.some((s) => s.caption),
    caption: root.querySelector('.fl-caption'),
    captionText: undefined,
    captionFade: undefined,
    pause: { button: pauseButton, icon: pauseButton.querySelector('.fl-pause-icon') },
    ring: createRing(pauseButton),
    tabs: [],
    tick: (now) => drawFrame(player, now),
  };
  player.tabs = createTabs(root.querySelector('.fl-tabs'), player);
  return player;
}

// ---- 시계 ----

// cost: time O(1), heap O(1), stack O(1)
// basis: estimate
function createClock() {
  return {
    index: 0,
    elapsed: 0,
    before: performance.now(),
    isPlaying: !matchMedia('(prefers-reduced-motion: reduce)').matches,
    rate: PLAYER_RATES[0],
  };
}

// cost: time O(1), heap O(1), stack O(1)
// basis: estimate
function nextRate(rate) {
  return PLAYER_RATES[(PLAYER_RATES.indexOf(rate) + 1) % PLAYER_RATES.length];
}

// cost: time O(1), heap O(1), stack O(1)
// basis: estimate
// 박자 seg가 속한 탭(step) 전체 시간 중 지금까지 지난 비율(0~1).
function tabProgress(player, seg) {
  const steps = player.stepSegs[seg.si];
  const start = steps[0].t0;
  const end = steps.at(-1).t1;
  return (seg.t0 - start + Math.min(player.clock.elapsed, seg.t1 - seg.t0)) / (end - start);
}

// cost: time O(h + k), heap O(1), stack O(1)
// vars: h = 박자의 이동 수, k = 카드가 바뀌는 도형 수
// basis: estimate
// 프레임마다 시계를 흘리고, 점과 카드를 옮기고, 재생 단추 고리를 채운다.
function drawFrame(player, now) {
  const { clock, data } = player;
  if (clock.isPlaying) clock.elapsed += (now - clock.before) * clock.rate;
  clock.before = now;
  const seg = data.segs[clock.index];
  advanceStage(player.stage, seg, clock.elapsed);
  player.ring.draw(tabProgress(player, seg));
  if (clock.elapsed >= seg.t1 - seg.t0) enterSegment(player, (clock.index + 1) % data.segs.length);
  requestAnimationFrame(player.tick);
}

// cost: time O(s + c + k + r), heap O(h), stack O(1)
// vars: s = 도형 수, c = 선 수, k = 카드 내용 수 합, r = 차트 행 수, h = 이동 수
// basis: estimate
// 박자 i로 들어간다. 시계를 0으로 돌리고 그림, 설명, 탭, 고리를 그 박자 상태로 맞춘다.
function enterSegment(player, i) {
  const { clock, data } = player;
  const seg = data.segs[i];
  clock.index = i;
  clock.elapsed = 0;
  drawSegmentState(player.stage, seg);
  showCaption(player, seg.caption);
  markTabs(player.tabs, seg.si);
  resetPackets(player.stage, seg);
  player.ring.draw(tabProgress(player, seg));
}

// cost: time O(n), heap O(n), stack O(1)
// vars: n = 설명 글자 수
// basis: estimate
// 설명 글을 바꾼다. 앞 글이 다 사라진 뒤 뒤 글이 나타난다(순차 페이드). 같은 글이면 그대로 두고, 첫 글과 움직임 줄이기 설정에서는 바로 바꾼다.
function showCaption(player, text) {
  const { caption } = player;
  caption.hidden = !player.hasCaption;
  if (text === player.captionText) return;
  const isFirst = player.captionText === undefined;
  player.captionText = text;
  player.captionFade?.cancel();
  const fadeMs = parseFloat(getComputedStyle(caption).getPropertyValue(CAPTION_FADE_VAR));
  const fill = () => caption.replaceChildren(...richNodes(text, htmlCode));
  if (isFirst || !fadeMs || matchMedia('(prefers-reduced-motion: reduce)').matches) {
    fill();
    return;
  }
  const out = caption.animate([{ opacity: getComputedStyle(caption).opacity }, { opacity: 0 }], { duration: fadeMs, fill: 'forwards' });
  player.captionFade = out;
  out.finished.then(() => {
    fill();
    player.captionFade = caption.animate([{ opacity: 0 }, { opacity: 1 }], { duration: fadeMs });
    out.cancel();
  }, () => {});
}

// 브라우저에서 돈다(play.js와 한 스크립트로 이어 붙는다). 재생 단추와 배속, 진행 고리, 탭, 설명 글의 백틱 코드.

const ICON_VIEWBOX = '0 0 16 16';

// ---- 재생 단추와 배속 ----

// cost: time O(1), heap O(1), stack O(1)
// basis: estimate
function bindControls(root, player) {
  const { clock, pause } = player;
  const rateButton = root.querySelector('.fl-rate');
  pause.button.addEventListener('click', () => setPlaying(player, !clock.isPlaying));
  rateButton.addEventListener('click', () => {
    clock.rate = nextRate(clock.rate);
    rateButton.textContent = `${clock.rate}×`;
  });
  root.addEventListener('keydown', (e) => {
    // 단추 위의 스페이스는 그 단추를 누르는 키다.
    if (e.key !== ' ' || e.target.closest('button')) return;
    setPlaying(player, !clock.isPlaying);
    e.preventDefault();
  });
}

// cost: time O(1), heap O(1), stack O(1)
// basis: estimate
function setPlaying(player, value) {
  const { clock, pause } = player;
  clock.isPlaying = value;
  pause.icon.innerHTML = playIconSvg(clock.isPlaying, player.data.metrics);
  pause.button.setAttribute('aria-label', clock.isPlaying ? '일시정지' : '재생');
}

// cost: time O(1), heap O(1), stack O(1)
// basis: estimate
// 재생 단추 아이콘. 재생 중이면 일시정지 모양, 멈췄으면 재생 모양이다. 도형은 16x16 좌표계다.
function playIconSvg(isPlaying, metrics) {
  const shape = isPlaying
    ? `<path d="M5 2.5v11M11 2.5v11" stroke="currentColor" stroke-width="${metrics.pauseStroke}" stroke-linecap="round"/>`
    : '<path d="M4 2.5v11l9.5-5.5z" fill="currentColor"/>';
  return `<svg width="${metrics.icon}" height="${metrics.icon}" viewBox="${ICON_VIEWBOX}">${shape}</svg>`;
}

// ---- 진행 고리 ----

// cost: time O(1), heap O(1), stack O(1)
// basis: estimate
// 고리 둘레는 마크업의 반지름에서 구한다. draw(0~1)로 12시에서 시계 방향으로 채운다.
function createRing(button) {
  const fill = button.querySelector('.fl-ring-fill');
  const length = 2 * Math.PI * fill.r.baseVal.value;
  fill.style.strokeDasharray = length;
  return {
    draw(progress) {
      fill.style.strokeDashoffset = length * (1 - progress);
    },
  };
}

// ---- 탭 ----

// cost: time O(s), heap O(s), stack O(1)
// vars: s = 탭 수
// basis: estimate
function createTabs(container, player) {
  const { data, stepSegs } = player;
  const buttons = data.steps.map((label, si) => createTab(label, () => enterSegment(player, data.segs.indexOf(stepSegs[si][0]))));
  container.append(...buttons);
  return buttons;
}

// cost: time O(n), heap O(n), stack O(1)
// vars: n = 글자 수
// basis: estimate
function createTab(label, onSelect) {
  const button = document.createElement('button');
  button.type = 'button';
  button.setAttribute('role', 'tab');
  button.append(...richNodes(label, htmlCode));
  button.addEventListener('click', onSelect);
  return button;
}

// cost: time O(s), heap O(1), stack O(1)
// vars: s = 탭 수
// basis: estimate
function markTabs(buttons, current) {
  buttons.forEach((button, si) => {
    button.classList.toggle('on', si === current);
    button.setAttribute('aria-selected', si === current);
  });
}

// cost: time O(n), heap O(n), stack O(1)
// vars: n = 글자 수
// basis: estimate
// 글을 백틱 기준으로 나눠 노드 목록으로 만든다. 홀수 번째 구간(백틱 안)은 makeCode가 만든 요소에 담는다.
function richNodes(text, makeCode) {
  return text
    .split('`')
    .map((part, i) => {
      if (!part) return null;
      if (i % 2 === 0) return document.createTextNode(part);
      const code = makeCode();
      code.textContent = part;
      return code;
    })
    .filter(Boolean);
}

// cost: time O(1), heap O(1), stack O(1)
// basis: estimate
function htmlCode() {
  const code = document.createElement('code');
  code.className = 'fl-code';
  return code;
}

// 브라우저에서 돈다(play.js와 한 스크립트로 이어 붙는다). 그림(SVG) 조각을 찾아 박자 상태를 그리고 점과 글 상자를 옮긴다.

const SVG_NS = 'http://www.w3.org/2000/svg';

// ---- 그림 그리기 ----

// cost: time O(s + c + r), heap O(s + c + r), stack O(1)
// vars: s = 도형 수, c = 선 수, r = 차트 행 수
// basis: estimate
// 그림(SVG) 조각을 한 번 찾아 둔 묶음. 점, 카드 대기열 같은 그림 쪽 상태도 여기에 둔다.
function createStage(root, data) {
  const svg = root.querySelector('svg.fl');
  const all = (selector) => [...svg.querySelectorAll(selector)];
  return {
    svg,
    metrics: data.metrics,
    edgeEnds: data.edgeEnds,
    cardCounts: data.cardCounts,
    packetLayer: svg.querySelector('.fl-packets'),
    nodes: data.cardCounts.map((_, i) => svg.querySelector(`#n-${i}`)),
    groups: all('.fl-group'),
    edges: data.edgeEnds.map((_, j) => svg.querySelector(`#e-${j}`)),
    paths: data.edgeEnds.map((_, j) => svg.querySelector(`#p-${j}`)),
    parts: all('.fl-part'),
    seriesEls: Array.from({ length: data.seriesCount }, (_, i) => all(`.cs-${i}`)),
    labelEls: all('.chart-label.shift'),
    rowEls: Array.from({ length: data.rowCount }, (_, k) => all(`.cr-${k}`)),
    packets: [],
    pendingCards: [],
  };
}

// cost: time O(n·c), heap O(n·c), stack O(1)
// vars: n = 도형 수, c = 선 수
// basis: estimate
// 도형에 마우스를 올리면 닿은 선을 밝힌다. 조용한 선도 그때 보인다.
function highlightOnHover(stage) {
  stage.nodes.forEach((g, i) => {
    const touching = stage.edgeEnds.map((e, j) => (e[0] === i || e[1] === i ? stage.edges[j] : null)).filter(Boolean);
    g?.addEventListener('mouseenter', () => touching.forEach((e) => e.classList.add('hover')));
    g?.addEventListener('mouseleave', () => touching.forEach((e) => e.classList.remove('hover')));
  });
}

// cost: time O(s + c + k + r), heap O(1), stack O(1)
// vars: s = 도형 수, c = 선 수, k = 카드 내용 수 합, r = 차트 행 수
// basis: estimate
// 박자 seg의 상태를 그린다. 점이 도착하는 도형의 카드는 cardsAt 시각에 바뀐다.
function drawSegmentState(stage, seg) {
  stage.nodes.forEach((g, n) => g?.classList.toggle('on', seg.nodesOn.includes(n)));
  stage.groups.forEach((g, n) => g.classList.toggle('on', seg.groupsOn.includes(n)));
  stage.edges.forEach((e, j) => e?.classList.toggle('on', seg.edgesOn.includes(j)));
  stage.parts.forEach((p) => p.classList.toggle('on', seg.partsOn.includes(p.dataset.part)));
  showCards(stage, seg.cardsBefore);
  stage.pendingCards = Object.entries(seg.cardsAt).map(([n, at]) => ({ n: Number(n), at }));
  drawChartState(stage, seg);
}

// cost: time O(k), heap O(1), stack O(1)
// vars: k = 카드 있는 도형 수
// basis: estimate
function showCards(stage, cards, only) {
  stage.cardCounts.forEach((count, n) => {
    if (!count || (only !== undefined && only !== n)) return;
    const shown = cards[n];
    for (let k = 0; k < count; k++) stage.svg.querySelector(`#n-${n}-c${k}`).setAttribute('opacity', shown === k ? 1 : 0);
    stage.nodes[n].querySelector('.fl-card').classList.toggle('on', shown !== undefined);
  });
}

// cost: time O(r + s), heap O(1), stack O(1)
// vars: r = 차트 행 수, s = 계열 수
// basis: estimate
// 차트: 드러낸 계열을 보이고, 이 박자에 드러내는 계열은 자라는 움직임을 다시 건다. light가 있으면 나머지 행을 흐린다.
function drawChartState(stage, seg) {
  stage.seriesEls.forEach((els, s) => {
    const isGrowing = seg.growing.includes(s);
    for (const el of els) {
      el.classList.toggle('hidden', !seg.series.includes(s));
      el.classList.remove('play');
      if (isGrowing) {
        el.getBoundingClientRect();
        el.classList.add('play');
      }
    }
  });
  stage.labelEls.forEach((el, k) => el.style.setProperty('--label-shift', `${seg.labelShifts[k] ?? 0}px`));
  stage.rowEls.forEach((els, k) => els.forEach((el) => el.classList.toggle('dim', seg.lights.length > 0 && !seg.lights.includes(k))));
}

// cost: time O(h), heap O(h), stack O(1)
// vars: h = 박자의 이동 수
// basis: estimate
function resetPackets(stage, seg) {
  stage.packets.forEach((p) => p.remove());
  stage.packets = seg.hops.map((hop) => createPacket(hop, stage));
  stage.packets.forEach((packet) => packet.move(0));
}

// cost: time O(h + k), heap O(1), stack O(1)
// vars: h = 박자의 이동 수, k = 카드가 바뀌는 도형 수
// basis: estimate
// 점을 옮기고, 도착한 도형의 카드를 바꾼다.
function advanceStage(stage, seg, elapsed) {
  stage.packets.forEach((packet) => packet.move(elapsed));
  stage.pendingCards = stage.pendingCards.filter(({ n, at }) => {
    if (elapsed < at) return true;
    showCards(stage, seg.cards, n);
    return false;
  });
}

// cost: time O(l), heap O(l), stack O(1)
// vars: l = 글 상자 줄 수
// basis: estimate
// 점과 글 상자. 글 상자 줄과 자리는 시간표가 움직이는 SVG와 같게 정해 넘긴다.
function createPacket(hop, stage) {
  const { metrics } = stage;
  const path = stage.paths[hop.edge];
  const g = document.createElementNS(SVG_NS, 'g');
  g.setAttribute('class', 'fl-packet');
  g.innerHTML = `<circle r="${metrics.halo}" fill="${metrics.active}" opacity="${metrics.haloOpacity}"/><circle r="${metrics.packet}" fill="${metrics.active}"/>`;
  stage.packetLayer.appendChild(g);
  const chip = hop.data ? createChip(hop.data, stage) : undefined;
  if (chip) g.appendChild(chip.g);
  const length = path.getTotalLength();
  const slide = chipSlide(hop, metrics);
  return {
    remove: () => g.remove(),
    move(t) {
      const p = Math.min(1, t / hop.ms);
      const eased = progressAt(metrics.move, p);
      const point = path.getPointAtLength(length * (hop.isBack ? 1 - eased : eased));
      g.setAttribute('transform', `translate(${point.x} ${point.y})`);
      if (chip) {
        const [dx, dy, opacity] = slide(p);
        chip.g.setAttribute('transform', `translate(${dx} ${dy})`);
        chip.g.style.opacity = opacity;
      }
      g.style.opacity = p >= 1 ? 0 : 1;
    },
  };
}

// cost: time O(l), heap O(l), stack O(1)
// vars: l = 글 상자 줄 수
// basis: estimate
function createChip(lines, stage) {
  const { metrics } = stage;
  const chip = document.createElementNS(SVG_NS, 'g');
  const rect = document.createElementNS(SVG_NS, 'rect');
  rect.setAttribute('rx', metrics.chipRadius);
  rect.setAttribute('fill', metrics.chipFill);
  chip.appendChild(rect);
  const texts = lines.map((line) => createChipLine(line, chip));
  stage.packetLayer.appendChild(chip);
  const w = Math.max(...texts.map((t) => t.getComputedTextLength())) + metrics.chipPadX;
  const h = texts.length * metrics.chipLine + metrics.chipPadY;
  const top = -h - metrics.chipGap;
  rect.setAttribute('x', -w / 2);
  rect.setAttribute('y', top);
  rect.setAttribute('width', w);
  rect.setAttribute('height', h);
  texts.forEach((t, li) => t.setAttribute('y', top + metrics.chipLine * (li + 1)));
  return { g: chip, w, h };
}

// cost: time O(n), heap O(n), stack O(1)
// vars: n = 글자 수
// basis: estimate
function createChipLine(line, chip) {
  const text = document.createElementNS(SVG_NS, 'text');
  text.setAttribute('class', 'chip');
  text.append(
    ...richNodes(line, () => {
      const code = document.createElementNS(SVG_NS, 'tspan');
      code.setAttribute('class', 'code');
      return code;
    }),
  );
  chip.appendChild(text);
  return text;
}

// 브라우저에서 돈다(play.js와 한 스크립트로 이어 붙는다). 점 이동 곡선(베지어)과 글 상자 미끄러짐.

const BISECT_STEPS = 30;

// ---- 이동 곡선 ----

// cost: time O(1), heap O(1), stack O(1)
// basis: estimate
// 베지어 곡선의 한 축 값. 매개변수 t의 제어점 a, b로 구한다.
function bezierAxis(a, b, t) {
  return 3 * a * t * (1 - t) ** 2 + 3 * b * t * t * (1 - t) + t ** 3;
}

// cost: time O(STEPS), heap O(1), stack O(1)
// vars: STEPS = BISECT_STEPS
// basis: estimate
// 곡선의 한 축 값이 target이 되는 매개변수 t를 이분 탐색으로 구한다.
function solveBezier(a, b, target) {
  let [low, high] = [0, 1];
  for (let i = 0; i < BISECT_STEPS; i++) {
    const mid = (low + high) / 2;
    if (bezierAxis(a, b, mid) < target) low = mid;
    else high = mid;
  }
  return (low + high) / 2;
}

// cost: time O(STEPS), heap O(1), stack O(1)
// vars: STEPS = BISECT_STEPS
// basis: estimate
// 시간 비율 p에서 이동 곡선의 진행 비율. easing.js의 timeAt과 같은 곡선을 반대 방향으로 푼다.
function progressAt([x1, y1, x2, y2], p) {
  return bezierAxis(y1, y2, solveBezier(x1, x2, p));
}

// cost: time O(STEPS), heap O(1), stack O(1)
// vars: STEPS = BISECT_STEPS
// basis: estimate
// 진행 비율 f에 닿는 시간 비율. easing.js의 timeAt과 같다.
function timeAtProgress([x1, y1, x2, y2], f) {
  return bezierAxis(x1, x2, solveBezier(y1, y2, f));
}

// cost: time O(STEPS·k), 프레임마다 O(k), heap O(k), stack O(1)
// vars: STEPS = BISECT_STEPS, k = 경로 지점 수
// basis: estimate
// 글 상자 옮김과 불투명도. 빌드 때 시간표에 담은 경로 지점별 [진행 비율, dx, dy, opacity]를 움직이는 SVG의 SMIL(지점이 점에 닿는 시각 사이를 선형)과 같게 시간 비율 p에서 보간한다. [dx, dy, opacity]를 돌려준다.
function chipSlide(hop, metrics) {
  const path = hop.chipPath ?? [];
  const times = path.map(([at]) => timeAtProgress(metrics.move, at));
  return (p) => {
    if (!path.length) return [0, 0, 1];
    const k = times.findLastIndex((time) => time <= p);
    if (k < 0) return path[0].slice(1);
    if (k === path.length - 1) return path[k].slice(1);
    const ratio = times[k + 1] > times[k] ? (p - times[k]) / (times[k + 1] - times[k]) : 1;
    return [1, 2, 3].map((i) => path[k][i] + (path[k + 1][i] - path[k][i]) * ratio);
  };
}

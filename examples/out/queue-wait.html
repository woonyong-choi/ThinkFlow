<script>if (window.self !== window.top) {
  document.documentElement.classList.add('embedded');
  addEventListener('message', (e) => {
    if (e.source !== parent || !e.data || !('theme' in e.data)) return;
    const root = document.documentElement;
    if (e.data.theme === 'light' || e.data.theme === 'dark') {
      root.setAttribute('data-theme', e.data.theme);
      root.style.colorScheme = e.data.theme;
    } else {
      root.removeAttribute('data-theme');
      root.style.colorScheme = '';
    }
  });
  parent.postMessage({ themeRequest: true }, '*');
  addEventListener('load', () => new ResizeObserver(() => parent.postMessage({ figureHeight: Math.ceil(document.body.getBoundingClientRect().height) }, '*')).observe(document.body));
}</script>

  --color-state-glow: var(--color-blue-dark-fill);
  --color-flow-brand: var(--color-blue-dark-stroke);
  --color-flow-purple: var(--color-purple-dark-dot);
  --color-flow-green: var(--color-green-dark-dot);
  --color-flow-gray: var(--color-gray-220);
  --color-flow-red: var(--color-red-dark-dot);
  --color-ui-link: var(--color-blue-dark-ink);
  --color-ui-focus: var(--color-blue-dark-stroke);
  --color-ui-progress: var(--color-blue-dark-stroke);
  --color-ui-control-on: var(--color-gray-776);
  --color-data-main: var(--color-blue-dark-stroke);
  --color-data-compare: var(--color-orange-dark-stroke);
  --color-data-heat-low: var(--color-blue-dark-heat-low);
  --color-data-heat-high: var(--color-blue-dark-heat-high);
  --color-data-heat-ink: var(--color-gray-0);
  --color-data-grid: var(--color-gray-776);
  --color-accent: var(--color-blue-dark-stroke);
  --color-figure-icon-service-ink: var(--color-blue-dark-ink);
  --color-figure-icon-service-surface: var(--color-blue-dark-fill);
  --color-figure-icon-data-ink: var(--color-purple-dark-ink);
  --color-figure-icon-data-surface: var(--color-purple-dark-fill);
  --color-figure-icon-access-ink: var(--color-orange-dark-ink);
  --color-figure-icon-access-surface: var(--color-orange-dark-fill);
  --color-figure-icon-person-ink: var(--color-green-dark-ink);
  --color-figure-icon-person-surface: var(--color-green-dark-fill);
  --color-figure-icon-brand-ink: var(--color-gray-220);
  --color-figure-icon-brand-surface: var(--color-gray-835);
  --simple2-play-fill: var(--color-blue-dark-stroke);
  --simple2-play-ink: var(--color-gray-933);
  --simple2-node-shadow: var(--primitive-simple2-node-shadow);
  --simple2-separator: var(--color-gray-635);
  --simple2-canvas-fill: var(--color-gray-910);
  --color-figure-icon: var(--color-blue-dark-stroke);
  --color-figure-icon-tile: var(--color-blue-dark-fill);
  --color-figure-queue-fill: var(--color-blue-dark-stroke);
  --color-figure-queue-empty: var(--color-gray-910);
  --color-paint-red-fill: var(--color-red-dark-fill);
  --color-paint-red-stroke: var(--color-red-dark-stroke);
  --color-paint-red-outline: var(--color-red-dark-outline);
  --color-paint-red-ink: var(--color-red-dark-ink);
  --color-paint-red-dot: var(--color-red-dark-dot);
  --color-paint-amber-fill: var(--color-palette-amber-dark-fill);
  --color-paint-amber-stroke: var(--color-palette-amber-dark-stroke);
  --color-paint-amber-outline: var(--color-palette-amber-dark-outline);
  --color-paint-amber-ink: var(--color-palette-amber-dark-ink);
  --color-paint-green-fill: var(--color-green-dark-fill);
  --color-paint-green-stroke: var(--color-green-dark-stroke);
  --color-paint-green-outline: var(--color-green-dark-outline);
  --color-paint-green-ink: var(--color-green-dark-ink);
  --color-paint-green-dot: var(--color-green-dark-dot);
  --color-paint-teal-fill: var(--color-palette-teal-dark-fill);
  --color-paint-teal-stroke: var(--color-palette-teal-dark-stroke);
  --color-paint-teal-outline: var(--color-palette-teal-dark-outline);
  --color-paint-teal-ink: var(--color-palette-teal-dark-ink);
  --color-paint-teal-dot: var(--color-palette-teal-dark-dot);
  --color-paint-navy-fill: var(--color-palette-navy-dark-fill);
  --color-paint-navy-stroke: var(--color-palette-navy-dark-stroke);
  --color-paint-navy-outline: var(--color-palette-navy-dark-outline);
  --color-paint-navy-ink: var(--color-palette-navy-dark-ink);
  --color-paint-purple-fill: var(--color-purple-dark-fill);
  --color-paint-purple-stroke: var(--color-purple-dark-stroke);
  --color-paint-purple-outline: var(--color-purple-dark-outline);
  --color-paint-purple-ink: var(--color-purple-dark-ink);
  --color-paint-purple-dot: var(--color-purple-dark-dot);
  --color-paint-purple-group-1: var(--color-purple-dark-tint-1);
  --color-paint-purple-group-2: var(--color-purple-dark-tint-2);
  --color-paint-purple-group-3: var(--color-purple-dark-tint-3);
  --color-paint-pink-fill: var(--color-palette-pink-dark-fill);
  --color-paint-pink-stroke: var(--color-palette-pink-dark-stroke);
  --color-paint-pink-outline: var(--color-palette-pink-dark-outline);
  --color-paint-pink-ink: var(--color-palette-pink-dark-ink);
  --color-paint-sky-fill: var(--color-palette-sky-dark-fill);
  --color-paint-sky-stroke: var(--color-palette-sky-dark-stroke);
  --color-paint-sky-outline: var(--color-palette-sky-dark-outline);
  --color-paint-sky-ink: var(--color-palette-sky-dark-ink);
  --color-paint-sky-group-1: var(--color-palette-sky-dark-tint-1);
  --color-paint-sky-group-2: var(--color-palette-sky-dark-tint-2);
  --color-paint-sky-group-3: var(--color-palette-sky-dark-tint-3);
  --color-paint-gray-fill: var(--color-palette-slate-dark-fill);
  --color-paint-gray-stroke: var(--color-palette-slate-dark-stroke);
  --color-paint-gray-outline: var(--color-palette-slate-dark-outline);
  --color-paint-gray-ink: var(--color-palette-slate-dark-ink);
  --color-paint-gray-dot: var(--color-palette-slate-dark-dot);
}
/* 조작 단추의 공통 모양과 상태. 재생기(원 단추, 탭), 목록 쪽과 문서 미리보기(테마 묶음)가 모두 이 파일 하나를 쓴다. */
.fl-round:focus-visible,
.fl-tabs button:focus-visible,
.theme button:focus-visible {
  outline: var(--simple2-focus-width) solid var(--color-ui-focus);
  outline-offset: var(--space-1);
}

/* 탭은 낮은 면으로 표시하고, 카드에만 입체 그림자를 둔다. */
.fl-tabs,
.theme {
  display: flex;
  box-sizing: border-box;
  min-height: var(--size-control-outer);
  padding: var(--space-2);
  background: transparent;
  border: 0;
  border-radius: var(--simple2-control-radius);
}

.fl-tabs button,
.theme button {
  min-height: var(--size-control-inner);
  min-width: var(--size-control-inner);
  font: var(--simple2-control) var(--font-sans);
  color: var(--color-muted);
  cursor: pointer;
  background: transparent;
  border: 0;
  border-radius: var(--simple2-control-radius);
}

.theme button {
  padding: 0 var(--space-6);
}

/* 켜진 탭은 옅은 파란 면과 굵은 글자로 구분한다. */
.fl-tabs button.on,
.theme button[aria-pressed='true'] {
  font-weight: var(--weight-semibold);
  color: var(--color-state-active-text);
  background: var(--color-card-on);
}

/* 같은 조작의 hover와 pressed를 재생기와 목록에서 공유한다. */
.fl-round:hover,
.fl-tabs button:hover,
.theme button:hover {
  color: var(--color-state-active-text);
  background: var(--color-card-on);
}

.fl-round:active,
.fl-tabs button:active,
.theme button:active {
  color: var(--color-state-on-active);
  background: var(--color-state-active-fill);
}

.fl-round:disabled,
.fl-tabs button:disabled,
.theme button:disabled {
  color: var(--color-muted);
  background: var(--color-surface);
  cursor: default;
}
/* 재생기 틀과 조작 막대. iframe 안(html.embedded)에서는 테두리와 바깥 여백을 뺀다. */
/* 그림 표시 폭 규칙: 문서 미리보기, 목록 카드, 재생기가 같다. 컨테이너 폭은 화면 폭에서 좌우 바깥 여백(simple2.page-gutter)을 뺀 값이고,
   그림 폭은 min(표준 캔버스 폭, 컨테이너 폭)이다. 컨테이너 안쪽에는 좌우 여백과 레이아웃을 차지하는 테두리를 두지 않아 세 곳의 그림 폭이 같다. */
body {
  margin: 0;
  padding: var(--simple2-page-gap) var(--simple2-page-gutter);
  font-family: var(--font-sans);
  letter-spacing: var(--tracking-text);
  color: var(--color-fg);
  background: var(--color-page);
}

/* 목록 쪽 카드 안은 틀이 카드 너비를 다 채워 양옆이 비치지 않게 하고, 바탕은 재생기 쪽과 같은 색으로 둔다. */
html.embedded body {
  padding: 0;
  background: var(--color-page);
}

.fl-figure {
  position: relative;
  max-width: var(--figure-canvas, var(--size-figure-canvas));
  margin: 0 auto;
  overflow: clip;
  color: var(--color-fg);
  background: var(--color-page);
  border-radius: 0;
}

html.embedded .fl-figure {
  max-width: none;
  border-radius: 0;
  box-shadow: none;
}

/* 그림의 바탕은 SVG와 같고, 조작 줄은 카드의 흰 면으로 구분한다. */
.fl-canvas {
  padding: var(--space-6) 0;
  background: var(--simple2-canvas-fill);
  border-radius: var(--simple2-canvas-corner);
  overflow: auto;
}

/* 그림은 표준 캔버스 폭 아래로 줄이지 않는다. 화면 높이에 맞춰 줄이지도 않는다. 세로로 긴 그림은 페이지가 길어지고(조작 막대는 화면 아래에 붙어 따라온다),
   화면 폭이 캔버스 폭보다 좁으면 그림 영역이 가로로 스크롤된다. 줄이면 글자가 가장 작은 글 토큰(size.text.9)보다 작아져 읽히지 않기 때문이다. */
.fl-canvas svg {
  display: block;
  width: auto;
  height: auto;
  min-width: var(--figure-canvas, var(--size-figure-canvas));
  margin: 0 auto;
}

/* 조작 막대와 설명 줄은 한 가운데 축을 쓴다. 위아래 안쪽 여백이 같고, 막대와 설명 사이는 한 칸(space-6)이다. */
.fl-foot {
  position: sticky;
  bottom: 0;
  z-index: var(--z-raised);
  display: grid;
  gap: var(--space-6);
  justify-items: center;
  padding: var(--simple2-page-gutter);
  background: var(--color-page);
}

/* 양쪽 칸 너비가 같아(1fr) 배속 글자가 바뀌어도 탭 묶음이 설명과 같은 축에 있다. */
.fl-bar {
  display: grid;
  grid-template-columns: minmax(var(--size-control-outer), 1fr) minmax(0, auto) minmax(var(--size-control-outer), 1fr);
  max-width: 100%;
  gap: var(--simple2-control-gap);
  align-items: center;
}

.fl-bar .fl-pause {
  justify-self: end;
}

.fl-bar .fl-rate {
  grid-column: 3;
  justify-self: start;
}

/* 현재 탭의 진행은 일시정지 단추 테두리 위를 12시에서 시계 방향으로 도는 진행(ui.progress) 고리다. 트랙은 단추 테두리 그대로다. */
.fl-pause {
  position: relative;
}

.fl-ring {
  position: absolute;
  inset: 0;
  width: var(--size-control-outer);
  height: var(--size-control-outer);
  pointer-events: none;
}

.fl-ring-fill {
  fill: none;
  stroke: var(--color-ui-progress);
}

.fl-pause-icon {
  display: grid;
  place-items: center;
}

.fl-round {
  display: grid;
  place-items: center;
  box-sizing: border-box;
  min-width: var(--size-control-outer);
  height: var(--size-control-outer);
  padding: 0 var(--space-2);
  font: var(--simple2-control) var(--font-sans);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  color: var(--color-muted);
  background: transparent;
  border: 0;
  border-radius: var(--radius-full);
  cursor: pointer;
}

.fl-tabs {
  flex-wrap: wrap;
  gap: var(--space-1);
  justify-content: center;
}

.fl-tabs button {
  position: relative;
  display: grid;
  place-items: center;
  padding: 0 var(--space-7);
}

/* 백틱으로 감싼 글. 코드 글꼴로 그린다. */
.fl-code {
  font-family: var(--font-figure-mono);
  letter-spacing: normal;
}

.fl-caption {
  max-width: var(--size-player-caption-max);
  min-height: calc(var(--size-text-13) * var(--leading-normal));
  margin: 0;
  font-size: var(--size-text-13);
  line-height: var(--leading-normal);
  text-align: center;
  color: var(--color-muted);
}

.fl-full {
  position: absolute;
  top: var(--space-5);
  right: var(--space-5);
  z-index: var(--z-raised);
}

.fl-figure.full {
  position: fixed;
  inset: 0;
  z-index: var(--z-overlay);
  display: flex;
  flex-direction: column;
  max-width: none;
  border-radius: 0;
}

.fl-figure.full .fl-canvas {
  display: grid;
  flex: 1;
  place-items: center;
}

.fl-figure.full .fl-canvas svg {
  width: 100%;
  min-width: 0;
  height: calc(100vh - var(--size-player-embedded-chrome));
  max-height: none;
  touch-action: none;
  user-select: none;
}

.fl-figure.full.zoomed .fl-canvas svg {
  cursor: grab;
}

.fl-figure.full.zoomed .fl-canvas svg:active {
  cursor: grabbing;
}

/* 확대·축소는 전체 화면에서만 보인다. 문서 안에서는 그림을 그대로 보이는 편이 읽기 쉽다. */
.fl-zoom {
  position: absolute;
  top: calc(var(--space-5) + var(--size-control-outer) + var(--space-3));
  right: var(--space-5);
  z-index: var(--z-raised);
  display: none;
  flex-direction: column;
  gap: var(--space-3);
}

.fl-figure.full .fl-zoom {
  display: flex;
}

.fl .fl-node.on .fl-halo {
  opacity: 1;
}

.fl .fl-node.on .fl-stroke {
  stroke: var(--color-state-active);
  stroke-width: var(--border-strong);
}

/* 내용이 없는 카드는 틀도 보이지 않는다(그리는 쪽이 opacity 0). 흐름 그림은 내용이 있어도 켜진 색은 아니라 filled가 따로 있다. */
.fl .fl-card.filled {
  opacity: 1;
}

.fl .fl-card.on {
  fill: var(--color-card-on);
  stroke: var(--color-state-active);
}

.fl .fl-edge.on .fl-path,
.fl .fl-edge.hover .fl-path {
  stroke: var(--color-state-active);
  stroke-width: var(--border-strong);
}

.fl .fl-edge.on .fl-path[marker-end],
.fl .fl-edge.hover .fl-path[marker-end] {
  marker-end: url("#fl-arrow-on");
}

.fl .fl-edge.on .fl-path[marker-start],
.fl .fl-edge.hover .fl-path[marker-start] {
  marker-start: url("#fl-arrow-on");
}

.fl .fl-edge.on .fl-pill rect {
  fill: var(--color-state-active-fill);
  stroke: var(--color-state-active-fill);
}

.fl .fl-edge.on .fl-pill text {
  fill: var(--color-state-on-active);
}

.fl .fl-path,
.fl .fl-stroke,
.fl .grid-cell,
.fl .fl-pill rect {
  transition: stroke var(--duration-fast), stroke-width var(--duration-fast), fill var(--duration-fast);
}

.fl .fl-layer,
.fl .fl-edge.quiet {
  transition: opacity var(--duration-fast);
}

/* 조용한 선은 지금 단계에서 쓰거나 마우스를 올린 도형에 닿을 때만 보인다. */
.fl .fl-edge.quiet:not(.on, .hover) {
  opacity: 0;
}

.fl .fl-node {
  cursor: default;
}

.fl-packet {
  pointer-events: none;
}

@media (prefers-reduced-motion: reduce) {
  .fl .fl-path,
  .fl .fl-stroke,
  .fl .grid-cell,
  .fl .fl-pill rect,
  .fl .fl-layer,
  .fl .fl-edge.quiet {
    transition: none;
  }
}

.fl .fl-group.on .fl-stroke {
  stroke: var(--color-state-active);
  stroke-width: var(--border-strong);
}

.fl .fl-part.on .part-bg {
  fill: var(--color-card-on);
}

.fl .fl-part.on .grid-cell {
  fill: var(--color-card-on);
}

.fl .fl-part.on .grid-ring {
  stroke: var(--color-state-active);
  stroke-width: var(--border-edge);
}

/* hidden 속성이 display: grid 같은 규칙에 지지 않게 한다. 시간 흐름 없는 그림의 빈 조작 막대를 숨기기 위해서다. */
[hidden] {
  display: none !important;
}

/* 보이는 재생 원은 36px, 누르는 영역은 공통 조작 높이를 유지한다. */
.fl-pause::before {
  position: absolute;
  width: var(--simple2-play-face);
  height: var(--simple2-play-face);
  background: var(--simple2-play-fill);
  border-radius: var(--radius-full);
  content: '';
}

.fl-pause .fl-pause-icon {
  position: relative;
  color: var(--simple2-play-ink);
}

.fl-pause-icon svg {
  fill: currentColor;
  stroke: none;
}

.fl-pause:hover,
.fl-pause:active {
  background: transparent;
}

.fl-pause:hover::before {
  background: var(--color-state-active);
}

.fl-pause:active::before {
  background: var(--color-state-active-fill);
}

.fl-context {
  display: grid;
  gap: var(--space-3);
  justify-items: center;
}

.fl-position {
  font-size: var(--simple2-caption);
  font-variant-numeric: tabular-nums;
  color: var(--color-muted);
}
/* 그림 안 글자와 모양. HTML 재생기와 움직이는 SVG가 같이 쓴다. */
.fl text {
  font-family: var(--font-figure-sans);
  letter-spacing: var(--tracking-text);
}

.fl .label {
  font-size: var(--size-text-13);
  font-weight: var(--weight-medium);
  text-anchor: middle;
  fill: var(--color-fg);
}

.fl .sub {
  font-size: var(--size-text-11);
  text-anchor: middle;
  fill: var(--color-muted);
}

.fl .frame {
  font-size: var(--size-text-11);
  font-weight: var(--weight-semibold);
  letter-spacing: var(--tracking-frame);
  fill: var(--color-group-title);
}

.fl .edgelabel {
  font-size: var(--size-text-11);
  text-anchor: middle;
  fill: var(--color-muted);
}

.fl .row {
  font-size: var(--size-text-11);
  fill: var(--color-fg);
}

.fl .row.mono {
  font-family: var(--font-figure-mono);
  letter-spacing: normal;
  font-size: var(--size-text-11);
}

/* 백틱으로 감싼 글. 코드 글꼴로 그린다. */
.fl .code {
  font-family: var(--font-figure-mono);
  letter-spacing: normal;
}

.fl .muted {
  fill: var(--color-muted);
}

.fl .tag {
  font-size: var(--size-text-9);
  font-weight: var(--weight-semibold);
  letter-spacing: var(--tracking-tag);
  text-anchor: middle;
  fill: var(--color-fg);
}

.fl .mark {
  font-size: var(--size-text-11);
  font-weight: var(--weight-semibold);
  text-anchor: end;
  fill: var(--color-state-active-text);
}

/* 값 카드 줄의 값 글자. 줄의 이름(row)은 카드 층이 그리고 값은 오른쪽 끝에 얹힌다. */
.fl .value {
  font-size: var(--size-text-11);
  font-weight: var(--weight-semibold);
  text-anchor: end;
  fill: var(--color-fg);
}

.fl .mini {
  font-size: var(--size-text-11);
  text-anchor: middle;
  fill: var(--color-fg);
}

.fl .mini.on {
  fill: var(--color-state-on-active);
}

.fl .chip {
  font-size: var(--size-text-11);
  text-anchor: middle;
  fill: var(--color-state-on-active);
}

.fl .cell {
  font-size: var(--size-text-13);
  fill: var(--color-fg);
}

.fl .item {
  font-size: var(--size-text-13);
  text-anchor: middle;
  fill: var(--color-fg);
}

.fl .item.gap {
  fill: var(--color-muted);
}

.fl .cell.type {
  font-family: var(--font-figure-mono);
  letter-spacing: normal;
  font-size: var(--size-text-11);
  text-anchor: end;
  fill: var(--color-muted);
}

.fl .fl-stroke {
  stroke: var(--color-outline);
  stroke-width: var(--border-thin);
}

.fl .fl-path {
  fill: none;
  stroke: var(--color-line);
  stroke-width: var(--border-edge);
}

.fl .cell .key {
  font-size: var(--size-text-9);
  font-weight: var(--weight-semibold);
  fill: var(--color-muted);
}

.fl .frame-box {
  fill: var(--color-group-1);
  stroke: none;
}

.fl .frame-box.d2 {
  fill: var(--color-group-2);
}

.fl .frame-box.d3 {
  fill: var(--color-group-3);
}

.fl .frame-box.dashed {
  stroke: var(--color-line);
}

.fl .lifeline {
  stroke: var(--color-line);
  stroke-width: var(--border-lifeline);
  stroke-dasharray: var(--dash-gap) var(--dash-gap);
}

.fl .note-box {
  fill: var(--color-surface);
  stroke: var(--color-line);
  stroke-dasharray: var(--dash-card) var(--dash-card);
}

.fl .pill {
  fill: var(--color-node);
  stroke: var(--color-outline);
}

.fl .part-bg {
  fill: transparent;
}

.fl .col-line {
  stroke: var(--simple2-separator);
  stroke-width: var(--border-hair);
}

.fl .grid-cell {
  fill: var(--color-node);
  stroke: var(--color-outline);
  stroke-width: var(--border-thin);
}

.fl .grid-ring {
  fill: none;
  stroke: none;
}

.fl .grid-cell.gap {
  fill: var(--color-surface);
  stroke: var(--color-line);
  stroke-dasharray: var(--dash-card) var(--dash-card);
}

.fl .grid-cell.empty {
  fill: none;
  stroke: var(--color-line);
  stroke-dasharray: var(--dash-card) var(--dash-card);
}

.fl .fl-edge.mark .fl-path {
  stroke: var(--color-fg);
}

/* 도형 윗줄과 그룹 제목 줄의 장식: 글자 배지, 아이콘 */
.fl .badge {
  font-size: var(--size-text-11);
  font-weight: var(--weight-semibold);
  text-anchor: middle;
  fill: var(--color-fg);
}

.fl .badge-pill {
  fill: var(--color-node);
  stroke: var(--color-outline);
  stroke-width: var(--border-thin);
}

.fl .fl-icon {
  color: var(--color-figure-icon);
}

.fl .fl-symbol .fl-icon {
  color: inherit;
}

/* 선 번호 원. 라벨 알약과 달리 켜져도 색이 바뀌지 않아 정지 그림과 같은 순서로 읽힌다. */
.fl .number-pill {
  fill: var(--color-fg);
}

.fl .number {
  font-size: var(--size-text-11);
  font-weight: var(--weight-semibold);
  text-anchor: middle;
  fill: var(--color-bg);
}

/* 표면에만 그림자를 두어 글자·아이콘·선의 가장자리는 선명하게 유지한다. */
.fl :where(.fl-node) > .fl-stroke {
  stroke-width: var(--simple2-node-stroke);
}

.fl :where(.fl-shape-rect, .fl-shape-box, .fl-shape-tile, .fl-shape-external, .fl-shape-store, .fl-shape-table, .fl-shape-grid, .fl-shape-queue) > .fl-stroke:not([fill="none"]) {
  stroke-width: var(--simple2-node-stroke);
  filter: var(--simple2-node-shadow);
}

.fl .fl-path,
.fl .fl-node > .fl-stroke {
  vector-effect: non-scaling-stroke;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* 조작 아이콘과 달리 의미 아이콘은 실루엣 안에 면과 세부 윤곽을 함께 가진다. */
.fl .fl-symbol-glyph {
  fill: none;
  stroke: currentColor;
  stroke-width: var(--simple2-symbol-stroke);
  stroke-linecap: round;
  stroke-linejoin: round;
}

.fl .symbol-solid {
  fill: currentColor;
  stroke: none;
}

.fl .symbol-cut {
  fill: none;
  stroke: var(--color-node);
}

.fl .fl-symbol-service {
  color: var(--color-figure-icon-service-ink);
}

.fl .fl-symbol-service .symbol-face {
  fill: var(--color-figure-icon-service-surface);
}

.fl .fl-symbol-data {
  color: var(--color-figure-icon-data-ink);
}

.fl .fl-symbol-data .symbol-face {
  fill: var(--color-figure-icon-data-surface);
}

.fl .fl-symbol-access {
  color: var(--color-figure-icon-access-ink);
}

.fl .fl-symbol-access .symbol-face {
  fill: var(--color-figure-icon-access-surface);
}

.fl .fl-symbol-person {
  color: var(--color-figure-icon-person-ink);
}

.fl .fl-symbol-person .symbol-face {
  fill: var(--color-figure-icon-person-surface);
}

.fl .fl-symbol-brand {
  color: var(--color-figure-icon-brand-ink);
}

.fl .fl-symbol-brand .symbol-face {
  fill: var(--color-figure-icon-brand-surface);
}
/* 차트 글자와 자라는 움직임. 차트 SVG 안에 들어가고, README 이미지에서도 보이게 되풀이한다. */
.fl .chart-title {
  font-size: var(--size-text-15);
  font-weight: var(--weight-semibold);
  fill: var(--color-fg);
}

.fl .chart-label {
  font-size: var(--size-text-13);
  font-weight: var(--weight-medium);
  fill: var(--color-fg);
}

.fl .chart-value,
.fl .chart-tick,
.fl .chart-unit {
  font-variant-numeric: tabular-nums;
  font-size: var(--size-text-11);
  fill: var(--color-muted);
}

.fl .chart-value {
  fill: var(--color-fg);
}

/* 값 글자와 점 이름은 뒤의 격자와 기준선이 글자 둘레에서 끊기게 바탕색 테두리를 두른다. */
.fl .chart-value,
.fl .chart-name {
  paint-order: stroke;
  stroke: var(--color-bg);
  stroke-width: var(--border-halo);
  stroke-linejoin: round;
}

.fl .chart-tick {
  text-anchor: middle;
}

.fl .chart-unit {
  text-anchor: end;
}

.fl .chart-value.start {
  text-anchor: start;
}

.fl .chart-value.end {
  text-anchor: end;
}

/* 값 글자는 계열과 상관없이 글자색이다. 계열은 막대, 점, 띠 색으로만 전하고 강조 계열(ours, second)은 굵기로만 구분한다. */
.fl .chart-value.ours,
.fl .chart-value.second {
  font-weight: var(--weight-semibold);
}

.fl .chart-name.end {
  text-anchor: end;
}

.fl .chart-missing {
  font-size: var(--size-text-11);
  font-style: italic;
  fill: var(--color-muted);
}

.fl .chart-ratio {
  font-variant-numeric: tabular-nums;
  font-size: var(--size-text-13);
  font-weight: var(--weight-semibold);
  text-anchor: end;
  fill: var(--color-fg);
}

.fl .chart-legend,
.fl .chart-sub,
.fl .chart-name,
.fl .chart-rule-label {
  font-size: var(--size-text-11);
  fill: var(--color-muted);
}

.fl .chart-tick.end,
.fl .chart-rule-label.end {
  text-anchor: end;
}

.fl .chart-unit.start {
  text-anchor: start;
}

/* 칸 색은 변수로 계산해 다크 모드 heat-low를 따라간다. --s는 칸 강도(0~1)다. */
.fl .chart-heat {
  fill: color-mix(in srgb, var(--color-data-heat-high) calc(var(--s) * 100%), var(--color-data-heat-low));
}

.fl .chart-cell {
  --ink: var(--color-data-heat-ink);
  font-variant-numeric: tabular-nums;
  font-size: var(--size-text-11);
  text-anchor: middle;
  fill: var(--ink);
}

.fl .chart-cell.on {
  --ink: var(--color-data-heat-ink-on);
}

/* 흐린 칸은 면이 바탕 쪽으로 옅어져 진한 칸의 밝은 글자가 묻힌다. 흐린 동안은 모든 칸이 어두운 글자(다크는 같은 밝은 글자)다. */
.fl .chart-cell.dim {
  fill: var(--color-data-heat-ink);
}

.fl .chart-axis,
.fl .chart-grid {
  stroke: var(--color-data-grid);
  stroke-width: var(--border-thin);
}

.fl .chart-zero {
  stroke: var(--color-muted);
  stroke-width: var(--border-tag);
}

.fl .chart-break {
  fill: none;
  stroke: var(--color-muted);
  stroke-width: var(--border-tag);
}

.fl .chart-rule {
  stroke: var(--color-muted);
  stroke-width: var(--border-thin);
  stroke-dasharray: var(--dash-line) var(--dash-gap);
}

.fl .chart-whisker,
.fl .chart-median {
  stroke: var(--color-fg);
  stroke-width: var(--border-tag);
}

.fl .chart-ci {
  stroke: var(--color-fg);
  stroke-width: var(--border-tag);
}

.fl .chart-ci-casing,
.fl .chart-rule-casing {
  stroke: var(--color-bg);
  stroke-width: var(--border-casing);
}

.fl .chart-interval {
  fill: none;
  stroke: var(--color-muted);
  stroke-width: var(--border-edge);
}

.fl .chart-band {
  fill-opacity: var(--opacity-band);
}

.fl .chart-range {
  stroke-linecap: round;
  stroke-opacity: var(--opacity-range);
}

.fl .chart-after {
  stroke: var(--color-bg);
  stroke-width: var(--border-tag);
}

.fl .chart-box {
  fill: var(--color-node);
  stroke: var(--color-data-main);
  stroke-width: var(--border-tag);
}

.fl .chart-before {
  fill: var(--color-bg);
  stroke: var(--color-data-compare);
  stroke-width: var(--border-tag);
}

.fl .chart-arrow,
.fl .chart-link {
  stroke: var(--color-data-main);
  stroke-width: var(--border-strong);
}

.fl .chart-link {
  stroke: var(--color-muted);
  stroke-width: var(--border-strong);
  stroke-linecap: round;
}

.fl .chart-label.shift {
  transform: translateY(var(--label-shift));
  transition: transform var(--duration-fast);
}

/* pathLength 1인 선이 stroke-dashoffset으로 그려진다. 선 차트의 선, 덤벨 화살표, 산점도 link가 함께 쓴다. */
.fl .draw {
  stroke-dasharray: 1;
}

.fl .grow {
  transform-box: fill-box;
  transform-origin: left center;
}

.fl .hidden {
  opacity: 0;
}

.fl .dim {
  opacity: var(--opacity-dim);
}

/* 면이 흐려지면 바탕과 대비가 3에 못 미치므로(막대 라이트 1.5) 같은 모양의 테두리가 이때만 보인다. 테두리는 흐림 투명도를 받지 않는다. */
.fl .rim.dim {
  opacity: 1;
}

/* 글자는 면보다 덜 흐려, 흐린 행에서도 글자가 바탕과 대비 4.5 이상이다(opacity.dim-ink). */
.fl .ink.dim {
  opacity: var(--opacity-dim-ink);
}

.fl .cs-0,
.fl .cs-1,
.fl [class*="cr-"] {
  transition: opacity var(--duration-fast);
}

/* 면이 바탕 쪽으로 옅어지는 중간에는 밝은 글자와 어두운 글자 모두 대비 4.5에 못 미친다. 칸 면과 글자는 서서히 가지 않고 한꺼번에 바뀐다. */
.fl .chart-heat-cell,
.fl .chart-cell.ink {
  transition: none;
}
</style>

<script>
const UI_ICONS = {"maximize-2":"\u003cpath d=\"M15 3h6v6\"/>\u003cpath d=\"m21 3-7 7\"/>\u003cpath d=\"m3 21 7-7\"/>\u003cpath d=\"M9 21H3v-6\"/>","minimize-2":"\u003cpath d=\"m14 10 7-7\"/>\u003cpath d=\"M20 10h-6V4\"/>\u003cpath d=\"m3 21 7-7\"/>\u003cpath d=\"M4 14h6v6\"/>","zoom-in":"\u003ccircle cx=\"11\" cy=\"11\" r=\"8\"/>\u003cline x1=\"21\" x2=\"16.65\" y1=\"21\" y2=\"16.65\"/>\u003cline x1=\"11\" x2=\"11\" y1=\"8\" y2=\"14\"/>\u003cline x1=\"8\" x2=\"14\" y1=\"11\" y2=\"11\"/>","zoom-out":"\u003ccircle cx=\"11\" cy=\"11\" r=\"8\"/>\u003cline x1=\"21\" x2=\"16.65\" y1=\"21\" y2=\"16.65\"/>\u003cline x1=\"8\" x2=\"14\" y1=\"11\" y2=\"11\"/>","scan":"\u003cpath d=\"M3 7V5a2 2 0 0 1 2-2h2\"/>\u003cpath d=\"M17 3h2a2 2 0 0 1 2 2v2\"/>\u003cpath d=\"M21 17v2a2 2 0 0 1-2 2h-2\"/>\u003cpath d=\"M7 21H5a2 2 0 0 1-2-2v-2\"/>","play":"\u003cpath d=\"M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z\"/>","pause":"\u003crect x=\"14\" y=\"3\" width=\"5\" height=\"18\" rx=\"1\"/>\u003crect x=\"5\" y=\"3\" width=\"5\" height=\"18\" rx=\"1\"/>"};
// 브라우저에서 돈다(play.js와 한 스크립트로 이어 붙는다).
// 전체 화면과, 전체 화면에서만 켜지는 확대·축소·끌어 옮기기를 맡는다. 문서 안에서는 그림을 그대로 보인다.

const ZOOM_ICONS = { in: 'zoom-in', out: 'zoom-out', fit: 'scan' };

// cost: time O(1) 시작, 휠·끌기마다 O(1), heap O(1), stack O(1)
// basis: estimate
/**
 * 그림 틀에 전체 화면 단추와 확대·축소를 붙인다.
 * @param root `.fl-figure` 요소. 안에 `.fl-full`, `.fl-zoom` 단추와 `svg.fl`이 있다
 * @param metrics { icon, iconStroke, zoomMax, zoomStep }
 */
function figureView(root, metrics) {
  const svg = root.querySelector('svg.fl');
  const base = svg.viewBox.baseVal;
  const home = { x: base.x, y: base.y, w: base.width, h: base.height };
  // 보는 상태 한 덩어리. view는 지금 viewBox, drag는 끄는 중인 손짓이다.
  const viewer = { root, svg, metrics, home, view: { ...home }, drag: undefined, fullButton: root.querySelector('.fl-full') };
  bindFull(viewer);
  bindZoom(viewer);
  bindPan(viewer);
  showFull(viewer, false);
}

// cost: time O(1), heap O(1), stack O(1)
// basis: estimate
function bindFull(viewer) {
  const { root, fullButton } = viewer;
  fullButton.addEventListener('click', () => setFull(viewer, !root.classList.contains('full')));
  document.addEventListener('fullscreenchange', () => showFull(viewer, document.fullscreenElement === root));
  root.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !document.fullscreenElement) setFull(viewer, false);
  });
}

// cost: time O(b), heap O(1), stack O(1)
// vars: b = 확대·축소 단추 수
// basis: estimate
function bindZoom(viewer) {
  const { root, metrics, home } = viewer;
  root.querySelectorAll('.fl-zoom button').forEach((b) => {
    b.innerHTML = drawUiIcon(metrics, ZOOM_ICONS[b.dataset.zoom]);
    b.addEventListener('click', () => (b.dataset.zoom === 'fit' ? setView(viewer, home) : zoomAt(viewer, b.dataset.zoom === 'in' ? metrics.zoomStep : 1 / metrics.zoomStep)));
  });
}

// cost: time O(1), heap O(1), stack O(1)
// basis: estimate
function bindPan(viewer) {
  const { svg } = viewer;
  svg.addEventListener('wheel', (e) => onWheel(viewer, e), { passive: false });
  svg.addEventListener('pointerdown', (e) => onPointerDown(viewer, e));
  svg.addEventListener('pointermove', (e) => onPointerMove(viewer, e));
  for (const type of ['pointerup', 'pointercancel', 'lostpointercapture']) svg.addEventListener(type, () => (viewer.drag = undefined));
}

// 브라우저 전체 화면을 먼저 쓰고, 막혀 있으면(iframe에 allowfullscreen이 없을 때 등) 창을 덮는 모양으로 대신한다.
function setFull(viewer, isFull) {
  const { root } = viewer;
  const canUseApi = Boolean(root.requestFullscreen) && document.fullscreenEnabled;
  if (!canUseApi) return showFull(viewer, isFull);
  if (isFull) root.requestFullscreen().catch(() => showFull(viewer, true));
  else if (document.fullscreenElement) document.exitFullscreen();
  else showFull(viewer, false);
}

function showFull(viewer, isFull) {
  const { root, fullButton, metrics, home } = viewer;
  root.classList.toggle('full', isFull);
  fullButton.innerHTML = drawUiIcon(metrics, isFull ? 'minimize-2' : 'maximize-2');
  const label = isFull ? '전체 화면 끝내기' : '전체 화면';
  fullButton.setAttribute('aria-label', label);
  fullButton.title = label;
  // 문서 안에서는 늘 전체 그림을 보인다.
  if (!isFull) setView(viewer, home);
}

// cost: time O(1), heap O(1), stack O(1)
// basis: estimate
// 휠을 굴린 자리를 중심으로 확대한다. 전체 화면이 아닐 때는 문서 스크롤에 맡긴다.
function onWheel(viewer, e) {
  if (!viewer.root.classList.contains('full')) return;
  e.preventDefault();
  // 가로로만 미는 손짓은 확대·축소가 아니다.
  if (e.deltaY === 0) return;
  const { zoomStep } = viewer.metrics;
  zoomAt(viewer, e.deltaY < 0 ? zoomStep : 1 / zoomStep, toSvgPoint(viewer.svg, e));
}

// cost: time O(1), heap O(1), stack O(1)
// basis: estimate
function onPointerDown(viewer, e) {
  const { root, svg, view, home } = viewer;
  const isMainButton = e.button === 0;
  if (!root.classList.contains('full') || view.w >= home.w || !isMainButton) return;
  // 끄는 동안 viewBox가 바뀌므로, 잡은 순간의 화면→그림 변환으로 거리를 잰다.
  viewer.drag = { start: toSvgPoint(svg, e), matrix: svg.getScreenCTM().inverse(), view: { ...view } };
  svg.setPointerCapture(e.pointerId);
}

// cost: time O(1), heap O(1), stack O(1)
// basis: estimate
// 끈 거리만큼 그림을 반대로 옮긴다. 잡은 자리가 손가락 아래에 머문다.
function onPointerMove(viewer, e) {
  const { drag } = viewer;
  if (!drag) return;
  const now = new DOMPoint(e.clientX, e.clientY).matrixTransform(drag.matrix);
  setView(viewer, { ...drag.view, x: drag.view.x - (now.x - drag.start.x), y: drag.view.y - (now.y - drag.start.y) });
}

// factor만큼 확대한다. 배율은 1배(전체)에서 metrics.zoomMax배 사이다.
function zoomAt(viewer, factor, center = { x: viewer.view.x + viewer.view.w / 2, y: viewer.view.y + viewer.view.h / 2 }) {
  const { view, home, metrics } = viewer;
  const w = Math.min(home.w, Math.max(home.w / metrics.zoomMax, view.w / factor));
  const k = w / view.w;
  setView(viewer, { x: center.x - (center.x - view.x) * k, y: center.y - (center.y - view.y) * k, w, h: view.h * k });
}

// cost: time O(1), heap O(1), stack O(1)
// basis: estimate
// 그림 밖으로 벗어나지 않게 자리를 막고 viewBox에 쓴다.
function setView(viewer, next) {
  const { home, svg, root } = viewer;
  const x = Math.min(home.x + home.w - next.w, Math.max(home.x, next.x));
  const y = Math.min(home.y + home.h - next.h, Math.max(home.y, next.y));
  viewer.view = { ...next, x, y };
  svg.setAttribute('viewBox', `${x} ${y} ${next.w} ${next.h}`);
  root.classList.toggle('zoomed', next.w < home.w);
}

// 화면 좌표를 그림 좌표로 바꾼다. 그림 비율과 svg 상자 비율이 달라 생기는 여백까지 브라우저 변환 행렬이 반영한다.
function toSvgPoint(svg, e) {
  const point = new DOMPoint(e.clientX, e.clientY).matrixTransform(svg.getScreenCTM().inverse());
  return { x: point.x, y: point.y };
}

// 조작부 아이콘. Lucide 원본 24 격자 외곽선 아이콘(UI_ICONS, html.js가 이 스크립트 앞에 붙인다)을 단색 currentColor 선으로 그린다. 선 굵기는 metrics.iconStroke 한 곳이다(Obsidian 기본 아이콘과 같은 모양).
function drawUiIcon(metrics, name) {
  return `<svg width="${metrics.icon}" height="${metrics.icon}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${metrics.iconStroke}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${UI_ICONS[name]}</svg>`;
}

// 브라우저에서 돈다. html.js가 HTML 안에 그대로 넣는다(src/player/ 파일을 이어 붙인다).
// 시간표의 박자 상태를 그대로 그린다. 상태를 다시 계산하지 않는다(docs/architecture.md 불변 조건).
// 이 파일은 재생기 본체다: 시작, 시계, 박자 이동, 설명 글. 역할별로 파일이 나뉜다: 단추와 탭과 진행 고리(controls.js), 그림 그리기(stage.js), 이동 곡선(curve.js), 전체 화면과 확대(view.js).

const PLAYER_RATES = [1, 2, 0.5];
// 설명 글이 바뀔 때 앞 글이 사라지고 뒤 글이 나타나는 각 시간(ms)을 담은 토큰 변수. 움직이는 SVG와 같은 토큰이다.
const CAPTION_FADE_VAR = '--duration-caption-fade';
const REDUCED_MOTION = matchMedia('(prefers-reduced-motion: reduce)');

// cost: time O(s + c) 시작, 프레임마다 O(h + k), heap O(s + c), stack O(1)
// vars: s = 도형 수, c = 선 수, h = 한 박자의 이동 수, k = 카드 있는 도형 수
// basis: estimate
/**
 * 재생기를 붙인다.
 * @param root `.fl-figure` 요소
 * @param data { segs, steps, cardCounts, edgeEnds, seriesCount, rowCount, metrics }
 */
function figurePlay(root, data) {
  const player = createPlayer(root, data);
  bindControls(root, player);
  highlightOnHover(player.stage);
  figureView(root, data.metrics);
  centerCanvas(root);
  setPlaying(player, player.clock.isPlaying);
  REDUCED_MOTION.addEventListener('change', () => REDUCED_MOTION.matches && settleReducedMotion(player));
  if (data.segs.length) {
    enterSegment(player, 0);
    requestAnimationFrame(player.tick);
  } else {
    // 시간 흐름이 없는 그림은 단계 이름과 설명이 없어 탭과 설명 줄을 숨기고 재생 단추와 배속만 둔다.
    // 차트는 다 자란 채 멈춰 있다가 재생을 누르면 되풀이한다.
    root.querySelector('.fl-tabs').hidden = true;
    root.querySelector('.fl-context').hidden = true;
    player.ring.draw(0);
  }
}

// cost: time O(s + r), heap O(1), stack O(1)
// vars: s = 계열 수, r = 차트 행 수
// basis: estimate
// 움직임 줄이기가 켜지면 바로 멈추고, 지금 단계까지 공개된 계열을 다 자란 정지 상태로 바꾼다. 꺼질 때는 아무것도 하지 않는다(재생은 사용자가 누른다).
function settleReducedMotion(player) {
  const { data, clock, stage } = player;
  setPlaying(player, false);
  if (data.segs.length) drawChartState(stage, data.segs[clock.index], false);
  else stage.svg.classList.remove('chart-loop');
}

// cost: time O(1), heap O(1), stack O(1)
// basis: estimate
// 사용자가 재생을 눌러 시계가 흐를 때만 차트를 움직인다.
function mayAnimate(clock) {
  return clock.isPlaying;
}

// cost: time O(1), heap O(1), stack O(1)
// basis: estimate
// 화면이 캔버스 폭보다 좁으면 그림 영역이 가로로 스크롤된다. 내용이 캔버스보다 좁은 그림은 내용이 캔버스 가운데에 있다(viewBox 왼쪽이 음수, 왼쪽 빈 판의 폭이 그 크기).
// 시작 위치는 화면 가운데이되 그림의 왼쪽 끝을 넘지 않는다. 그림이 화면에 들어오면 가운데에 있고, 그림이 화면보다 넓으면 왼쪽 끝(이름과 축)부터 보인다.
// 캔버스를 꽉 채우는 차트와 넓은 그림은 viewBox 왼쪽이 0이라 왼쪽 끝에서 시작한다. 화면 크기가 바뀌어도 다시 맞춘다.
function centerCanvas(root) {
  const canvas = root.querySelector('.fl-canvas');
  const svg = root.querySelector('svg.fl');
  const place = () => {
    const { x, width } = svg.viewBox.baseVal;
    const leftMargin = Math.max(0, -x) * (svg.getBoundingClientRect().width / width);
    canvas.scrollLeft = Math.min((canvas.scrollWidth - canvas.clientWidth) / 2, leftMargin);
  };
  place();
  addEventListener('resize', place);
}

// cost: time O(s + c), heap O(s + c), stack O(1)
// vars: s = 도형 수, c = 선 수
// basis: estimate
// 재생기 상태 한 덩어리. 시계, 그림, 탭, 고리, 설명 줄이 이 객체 하나로 이어진다.
function createPlayer(root, data) {
  const pauseButton = root.querySelector('.fl-pause');
  const player = {
    data,
    stage: createStage(root, data),
    clock: createClock(),
    stepSegs: data.steps.map((_, si) => data.segs.filter((s) => s.si === si)),
    hasCaption: data.segs.some((s) => s.caption),
    caption: root.querySelector('.fl-caption'),
    position: root.querySelector('.fl-position'),
    captionText: undefined,
    captionFade: undefined,
    pause: { button: pauseButton, icon: pauseButton.querySelector('.fl-pause-icon') },
    ring: createRing(pauseButton),
    tabs: [],
    tick: (now) => drawFrame(player, now),
  };
  player.tabs = createTabs(root.querySelector('.fl-tabs'), player);
  return player;
}

// ---- 시계 ----

// cost: time O(1), heap O(1), stack O(1)
// basis: estimate
function createClock() {
  return {
    index: 0,
    elapsed: 0,
    before: performance.now(),
    isPlaying: false,
    rate: PLAYER_RATES[0],
  };
}

// cost: time O(1), heap O(1), stack O(1)
// basis: estimate
function nextRate(rate) {
  return PLAYER_RATES[(PLAYER_RATES.indexOf(rate) + 1) % PLAYER_RATES.length];
}

// cost: time O(1), heap O(1), stack O(1)
// basis: estimate
// 박자 seg가 속한 탭(step) 전체 시간 중 지금까지 지난 비율(0~1).
function tabProgress(player, seg) {
  const steps = player.stepSegs[seg.si];
  const start = steps[0].t0;
  const end = steps.at(-1).t1;
  return (seg.t0 - start + Math.min(player.clock.elapsed, seg.t1 - seg.t0)) / (end - start);
}

// cost: time O(h + k), heap O(1), stack O(1)
// vars: h = 박자의 이동 수, k = 카드가 바뀌는 도형 수
// basis: estimate
// 프레임마다 시계를 흘리고, 점과 카드를 옮기고, 재생 단추 고리를 채운다.
function drawFrame(player, now) {
  const { clock, data } = player;
  if (clock.isPlaying) clock.elapsed += (now - clock.before) * clock.rate;
  clock.before = now;
  const seg = data.segs[clock.index];
  if (clock.isPlaying) {
    advanceStage(player.stage, seg, clock.elapsed);
    player.ring.draw(tabProgress(player, seg));
    if (clock.elapsed >= seg.t1 - seg.t0) enterSegment(player, (clock.index + 1) % data.segs.length);
  }
  requestAnimationFrame(player.tick);
}

// cost: time O(s + c + k + r), heap O(h), stack O(1)
// vars: s = 도형 수, c = 선 수, k = 카드 내용 수 합, r = 차트 행 수, h = 이동 수
// basis: estimate
// 박자 i로 들어간다. 시계를 0으로 돌리고 그림, 설명, 탭, 고리를 그 박자 상태로 맞춘다.
function enterSegment(player, i) {
  const { clock, data } = player;
  const seg = data.segs[i];
  clock.index = i;
  clock.elapsed = 0;
  drawSegmentState(player.stage, seg, mayAnimate(clock));
  showCaption(player, seg.caption);
  markTabs(player.tabs, seg.si);
  player.position.textContent = `${seg.si + 1} / ${data.steps.length}`;
  resetPackets(player.stage, seg);
  advanceStage(player.stage, seg, 0);
  syncChartMotion(player.stage, clock);
  player.ring.draw(tabProgress(player, seg));
}

// cost: time O(n), heap O(n), stack O(1)
// vars: n = 설명 글자 수
// basis: estimate
// 설명 글을 바꾼다. 앞 글이 다 사라진 뒤 뒤 글이 나타난다(순차 페이드). 같은 글이면 그대로 두고, 첫 글과 움직임 줄이기 설정에서는 바로 바꾼다.
function showCaption(player, text) {
  const { caption } = player;
  caption.hidden = !player.hasCaption;
  if (text === player.captionText) return;
  const isFirst = player.captionText === undefined;
  player.captionText = text;
  player.captionFade?.cancel();
  const fadeMs = parseFloat(getComputedStyle(caption).getPropertyValue(CAPTION_FADE_VAR));
  const fill = () => caption.replaceChildren(...richNodes(text, htmlCode));
  if (isFirst || !player.clock.isPlaying || !fadeMs || REDUCED_MOTION.matches) {
    fill();
    return;
  }
  const out = caption.animate([{ opacity: getComputedStyle(caption).opacity }, { opacity: 0 }], { duration: fadeMs, fill: 'forwards' });
  player.captionFade = out;
  out.finished.then(() => {
    fill();
    player.captionFade = caption.animate([{ opacity: 0 }, { opacity: 1 }], { duration: fadeMs });
    out.cancel();
  }, () => {});
}

// 브라우저에서 돈다(play.js와 한 스크립트로 이어 붙는다). 재생 단추와 배속, 진행 고리, 탭, 설명 글의 백틱 코드.

// ---- 재생 단추와 배속 ----

// cost: time O(1), heap O(1), stack O(1)
// basis: estimate
function bindControls(root, player) {
  const { clock, pause } = player;
  const rateButton = root.querySelector('.fl-rate');
  pause.button.addEventListener('click', () => setPlaying(player, !clock.isPlaying));
  rateButton.addEventListener('click', () => {
    clock.rate = nextRate(clock.rate);
    rateButton.textContent = `${clock.rate}×`;
    syncChartMotion(player.stage, clock);
  });
  root.addEventListener('keydown', (e) => {
    // 단추 위의 스페이스는 그 단추를 누르는 키다.
    if (e.key !== ' ' || e.target.closest('button')) return;
    setPlaying(player, !clock.isPlaying);
    e.preventDefault();
  });
}

// cost: time O(1), heap O(1), stack O(1)
// basis: estimate
function setPlaying(player, value) {
  const { clock, pause } = player;
  const wasPlaying = clock.isPlaying;
  clock.isPlaying = value;
  clock.before = performance.now();
  if (value && !wasPlaying && clock.elapsed === 0 && player.data.segs.length) {
    drawChartState(player.stage, player.data.segs[clock.index], true);
  }
  pause.icon.innerHTML = playIconSvg(clock.isPlaying, player.data.metrics);
  pause.button.setAttribute('aria-label', clock.isPlaying ? '일시정지' : '재생');
  syncChartMotion(player.stage, clock);
}

// cost: time O(1), heap O(1), stack O(1)
// basis: estimate
// 재생 단추 아이콘. 재생 중이면 일시정지 모양, 멈췄으면 재생 모양이다.
function playIconSvg(isPlaying, metrics) {
  return drawUiIcon(metrics, isPlaying ? 'pause' : 'play');
}

// ---- 진행 고리 ----

// cost: time O(1), heap O(1), stack O(1)
// basis: estimate
// 고리 둘레는 마크업의 반지름에서 구한다. draw(0~1)로 12시에서 시계 방향으로 채운다.
function createRing(button) {
  const fill = button.querySelector('.fl-ring-fill');
  const length = 2 * Math.PI * fill.r.baseVal.value;
  fill.style.strokeDasharray = length;
  return {
    draw(progress) {
      fill.style.strokeDashoffset = length * (1 - progress);
      fill.style.visibility = progress > 0 ? 'visible' : 'hidden';
    },
  };
}

// ---- 탭 ----

// cost: time O(s), heap O(s), stack O(1)
// vars: s = 탭 수
// basis: estimate
function createTabs(container, player) {
  const { data, stepSegs } = player;
  const buttons = data.steps.map((label, si) => createTab(label, () => {
    setPlaying(player, false);
    enterSegment(player, data.segs.indexOf(stepSegs[si][0]));
  }));
  container.addEventListener('keydown', (event) => moveTab(event, buttons));
  container.append(...buttons);
  return buttons;
}

// cost: time O(n), heap O(n), stack O(1)
// vars: n = 글자 수
// basis: estimate
function createTab(label, onSelect) {
  const button = document.createElement('button');
  button.type = 'button';
  button.setAttribute('role', 'tab');
  button.append(...richNodes(label, htmlCode));
  button.addEventListener('click', onSelect);
  return button;
}

// cost: time O(s), heap O(1), stack O(1)
// vars: s = 탭 수
// basis: estimate
function markTabs(buttons, current) {
  buttons.forEach((button, si) => {
    button.classList.toggle('on', si === current);
    button.setAttribute('aria-selected', si === current);
    button.tabIndex = si === current ? 0 : -1;
  });
}

// cost: time O(n), heap O(n), stack O(1)
// vars: n = 글자 수
// basis: estimate
// 글을 백틱 기준으로 나눠 노드 목록으로 만든다. 홀수 번째 구간(백틱 안)은 makeCode가 만든 요소에 담는다.
function richNodes(text, makeCode) {
  return text
    .split('`')
    .map((part, i) => {
      if (!part) return null;
      if (i % 2 === 0) return document.createTextNode(part);
      const code = makeCode();
      code.textContent = part;
      return code;
    })
    .filter(Boolean);
}

// cost: time O(1), heap O(1), stack O(1)
// basis: estimate
function htmlCode() {
  const code = document.createElement('code');
  code.className = 'fl-code';
  return code;
}

// cost: time O(s), heap O(1), stack O(1)
// vars: s = 단계 단추 수
// basis: estimate
// 탭 안에서는 화살표로 장면을 고르고 Tab은 조작 묶음 밖으로 이동한다.
function moveTab(event, buttons) {
  const current = buttons.indexOf(event.target);
  if (current < 0) return;
  const keys = { ArrowRight: (current + 1) % buttons.length, ArrowLeft: (current + buttons.length - 1) % buttons.length, Home: 0, End: buttons.length - 1 };
  const next = keys[event.key];
  if (next === undefined) return;
  event.preventDefault();
  buttons[next].click();
  buttons[next].focus();
}

// 브라우저에서 돈다(play.js와 한 스크립트로 이어 붙는다). 그림(SVG) 조각을 찾아 박자 상태를 그리고 점과 글 상자를 옮긴다.

const SVG_NS = 'http://www.w3.org/2000/svg';

// ---- 그림 그리기 ----

// cost: time O(s + c + r), heap O(s + c + r), stack O(1)
// vars: s = 도형 수, c = 선 수, r = 차트 행 수
// basis: estimate
// 그림(SVG) 조각을 한 번 찾아 둔 묶음. 점, 카드 대기열 같은 그림 쪽 상태도 여기에 둔다.
function createStage(root, data) {
  const svg = root.querySelector('svg.fl');
  const all = (selector) => [...svg.querySelectorAll(selector)];
  return {
    svg,
    metrics: data.metrics,
    edgeEnds: data.edgeEnds,
    cardCounts: data.cardCounts,
    packetLayer: svg.querySelector('.fl-packets'),
    nodes: data.cardCounts.map((_, i) => svg.querySelector(`#n-${i}`)),
    groups: all('.fl-group'),
    edges: data.edgeEnds.map((_, j) => withLabel(svg.querySelector(`#e-${j}`), svg.querySelector(`#l-${j}`))),
    paths: data.edgeEnds.map((_, j) => svg.querySelector(`#p-${j}`)),
    trackPaths: Array.from({ length: data.trackCount ?? 0 }, (_, k) => svg.querySelector(`#tp-${k}`)),
    values: data.values ?? [],
    valueEls: createValueEls(svg, data),
    pendingOn: [],
    pendingPulses: [],
    parts: all('.fl-part'),
    seriesEls: Array.from({ length: data.seriesCount }, (_, i) => all(`.cs-${i}`)),
    labelEls: all('.chart-label.shift'),
    rowEls: Array.from({ length: data.rowCount }, (_, k) => all(`.cr-${k}`)),
    isStill: data.segs.length === 0,
    packets: [],
    pendingCards: [],
  };
}

// cost: time O(1), heap O(1), stack O(1)
// basis: estimate
// 선 묶음과 알약 묶음(점 층 위에 따로 그려진다)의 class를 함께 바꾸는 손잡이. 알약이 없으면 선만 바꾼다.
function withLabel(edge, label) {
  const both = (act) => (name, on) => [edge, label].forEach((el) => el && act(el.classList, name, on));
  return { classList: { toggle: both((list, name, on) => list.toggle(name, on)), add: both((list, name) => list.add(name)), remove: both((list, name) => list.remove(name)) } };
}

// cost: time O(n·c), heap O(n·c), stack O(1)
// vars: n = 도형 수, c = 선 수
// basis: estimate
// 도형에 마우스를 올리면 닿은 선을 밝힌다. 조용한 선도 그때 보인다.
function highlightOnHover(stage) {
  stage.nodes.forEach((g, i) => {
    const touching = stage.edgeEnds.map((e, j) => (e[0] === i || e[1] === i ? stage.edges[j] : null)).filter(Boolean);
    g?.addEventListener('mouseenter', () => touching.forEach((e) => e.classList.add('hover')));
    g?.addEventListener('mouseleave', () => touching.forEach((e) => e.classList.remove('hover')));
  });
}

// cost: time O(s + c + k + r), heap O(1), stack O(1)
// vars: s = 도형 수, c = 선 수, k = 카드 내용 수 합, r = 차트 행 수
// basis: estimate
// 박자 seg의 상태를 그린다. 점이 도착하는 도형의 카드는 cardsAt 시각에 바뀐다.
function drawSegmentState(stage, seg, mayGrow) {
  stage.isFlow = Boolean(seg.pulses);
  stage.nodes.forEach((g, n) => g?.classList.toggle('on', seg.nodesOn.includes(n)));
  stage.groups.forEach((g, n) => g.classList.toggle('on', seg.groupsOn.includes(n)));
  stage.edges.forEach((e, j) => e?.classList.toggle('on', seg.edgesOn.includes(j)));
  stage.parts.forEach((p) => p.classList.toggle('on', seg.partsOn.includes(p.dataset.part)));
  showCards(stage, seg.cardsBefore);
  stage.pendingCards = Object.entries(seg.cardsAt).map(([n, at]) => ({ n: Number(n), at }));
  stage.pendingOn = pendingLights(stage, seg);
  stage.pendingPulses = [...(seg.pulses ?? [])];
  drawValueState(stage, seg, seg.t0);
  drawChartState(stage, seg, mayGrow);
}

// cost: time O(e + s), heap O(e + s), stack O(1)
// vars: e = 처음 닿는 선 수, s = 처음 닿는 도형과 그룹 수
// basis: estimate
// 흐름 구간에서 점이 처음 닿는 시각에 켜질 선, 도형, 그룹. 구간 처음부터 켜진 것은 이미 켜져 있어 뺀다.
function pendingLights(stage, seg) {
  const timed = (at, els, on) => Object.entries(at ?? {}).filter(([i]) => !on.includes(Number(i))).map(([i, ms]) => ({ el: els[i], at: ms }));
  return [...timed(seg.edgesAt, stage.edges, seg.edgesOn), ...timed(seg.nodesAt, stage.nodes, seg.nodesOn), ...timed(seg.groupsAt, stage.groups, seg.groupsOn)];
}

// cost: time O(k), heap O(1), stack O(1)
// vars: k = 카드 있는 도형 수
// basis: estimate
function showCards(stage, cards, only) {
  stage.cardCounts.forEach((count, n) => {
    if (!count || (only !== undefined && only !== n)) return;
    const shown = cards[n];
    for (let k = 0; k < count; k++) stage.svg.querySelector(`#n-${n}-c${k}`).setAttribute('opacity', shown === k ? 1 : 0);
    const frame = stage.nodes[n].querySelector('.fl-card');
    frame.classList.toggle('on', shown !== undefined && !stage.isFlow);
    frame.classList.toggle('filled', shown !== undefined);
  });
}

// cost: time O(r + s), heap O(1), stack O(1)
// vars: r = 차트 행 수, s = 계열 수
// basis: estimate
// 차트: 드러낸 계열을 보이고, 이 박자에 드러내는 계열은 자라는 움직임을 다시 건다(mayGrow가 거짓이면 걸지 않고 다 자란 채 둔다). light가 있으면 나머지 행을 흐린다.
function drawChartState(stage, seg, mayGrow) {
  stage.seriesEls.forEach((els, s) => {
    const isGrowing = mayGrow && seg.growing.includes(s);
    for (const el of els) {
      el.classList.toggle('hidden', !seg.series.includes(s));
      el.classList.remove('play');
      if (isGrowing) {
        el.getBoundingClientRect();
        el.classList.add('play');
      }
    }
  });
  stage.labelEls.forEach((el, k) => el.style.setProperty('--label-shift', `${seg.labelShifts[k] ?? 0}px`));
  stage.rowEls.forEach((els, k) => els.forEach((el) => el.classList.toggle('dim', seg.lights.length > 0 && !seg.lights.includes(k))));
}

// cost: time O(a), heap O(a), stack O(1)
// vars: a = 차트 움직임 수
// basis: estimate
// 차트 움직임(막대, 선, 값 글자, 점의 CSS 애니메이션)을 박자 시계에 맞춘다. CSS 애니메이션은 브라우저 시계를 따로 따르므로
// 정지면 멈추고 재개하면 잇고, 배속이면 재생 속도를 같게 한다. 모델 상태는 다시 계산하지 않는다(상태는 시간표가 정한다).
// 이미 끝난 움직임은 건드리지 않는다. play()는 끝난 움직임을 처음부터 다시 돌리기 때문이다.
function syncChartMotion(stage, clock) {
  // 시간 흐름 없는 차트는 되풀이 움직임(chart-loop)을 재생을 켤 때 건다. 건 뒤에는 정지와 재개를 아래 반복문이 맡는다.
  if (stage.isStill && clock.isPlaying) stage.svg.classList.add('chart-loop');
  for (const animation of stage.svg.getAnimations({ subtree: true })) {
    if (!animation.animationName?.startsWith('chart-')) continue;
    animation.playbackRate = clock.rate;
    if (!clock.isPlaying && animation.playState === 'running') animation.pause();
    else if (clock.isPlaying && animation.playState === 'paused') animation.play();
  }
}

// cost: time O(h), heap O(h), stack O(1)
// vars: h = 박자의 이동 수
// basis: estimate
function resetPackets(stage, seg) {
  stage.packets.forEach((p) => p.remove());
  stage.packets = seg.hops.map((hop) => createPacket(hop, stage));
  stage.packets.forEach((packet) => packet.move(0));
}

// cost: time O(h + k), heap O(1), stack O(1)
// vars: h = 박자의 이동 수, k = 카드가 바뀌는 도형 수
// basis: estimate
// 점을 옮기고, 도착한 도형의 카드를 바꾼다.
function advanceStage(stage, seg, elapsed) {
  stage.packets.forEach((packet) => packet.move(elapsed));
  stage.pendingCards = stage.pendingCards.filter(({ n, at }) => {
    if (elapsed < at) return true;
    showCards(stage, seg.cards, n);
    return false;
  });
  stage.pendingOn = stage.pendingOn.filter(({ el, at }) => {
    if (elapsed < at) return true;
    el?.classList.add('on');
    return false;
  });
  stage.pendingPulses = stage.pendingPulses.filter(({ n, at }) => {
    if (elapsed < at) return true;
    if (elapsed - at < stage.metrics.pulseMs) pulseNode(stage, n);
    return false;
  });
  drawValueState(stage, seg, seg.t0 + elapsed);
}

// cost: time O(1), heap O(1), stack O(1)
// basis: estimate
// 점이 닿은 도형의 후광을 한 번 깜빡인다. 도형은 켜지지 않고 테두리도 그대로다.
function pulseNode(stage, n) {
  stage.nodes[n]?.querySelector('.fl-halo')?.animate([{ opacity: 1 }, { opacity: 0 }], { duration: stage.metrics.pulseMs });
}

// cost: time O(l), heap O(l), stack O(1)
// vars: l = 글 상자 줄 수
// basis: estimate
// 점과 글 상자. 글 상자 줄과 자리는 시간표가 움직이는 SVG와 같게 정해 넘긴다.
function createPacket(hop, stage) {
  const { metrics } = stage;
  const path = hop.track === undefined ? stage.paths[hop.edge] : stage.trackPaths[hop.track];
  const color = hop.tone ? metrics.tones[hop.tone] : metrics.active;
  const g = document.createElementNS(SVG_NS, 'g');
  g.setAttribute('class', 'fl-packet');
  g.innerHTML = `<circle r="${metrics.halo}" fill="${color}" opacity="${metrics.haloOpacity}"/><circle r="${metrics.packet}" fill="${color}"/>`;
  stage.packetLayer.appendChild(g);
  const chip = hop.data ? createChip(hop.data, { stage, color: hop.tone ? color : undefined }) : undefined;
  if (chip) g.appendChild(chip.g);
  const length = path.getTotalLength();
  const slide = chipSlide(hop, metrics);
  return {
    remove: () => g.remove(),
    // cost: time O(g + l), heap O(1), stack O(1)
    // vars: g = 도형 안을 지나는 구간 수, l = 글 상자 경로 지점 수
    // basis: estimate
    move(elapsed) {
      const t = elapsed - (hop.at ?? 0);
      const p = Math.min(1, Math.max(0, t / hop.ms));
      const eased = progressAt(metrics.move, p);
      const point = path.getPointAtLength(length * (hop.isBack ? 1 - eased : eased));
      g.setAttribute('transform', `translate(${point.x} ${point.y})`);
      if (chip) {
        const [dx, dy, opacity] = slide(p);
        chip.g.setAttribute('transform', `translate(${dx} ${dy})`);
        chip.g.style.opacity = opacity * chipFadeAt(hop.chipFade, t);
      }
      const isInside = (hop.gaps ?? []).some(([from, to]) => eased > from && eased < to);
      g.style.opacity = isShown(hop, t, isInside) ? cutFade(hop, t, metrics) : 0;
    },
  };
}

// cost: time O(1), heap O(1), stack O(1)
// basis: estimate
// 점이 보이는 때인지. 이동 시작 전, 도형 안(isInside), 끝에 닿은 뒤, 단계 끝에서 잘린 뒤(hop.cut)는 보이지 않는다.
function isShown(hop, t, isInside) {
  return t >= 0 && t < (hop.cut ?? hop.ms) && !isInside;
}

// cost: time O(1), heap O(1), stack O(1)
// basis: estimate
// 단계 끝에서 잘리는 점(hop.cut)이 끝 앞 cutFadeMs 동안 서서히 사라지는 불투명도. 그 밖의 점은 1이다.
function cutFade(hop, t, metrics) {
  return hop.cut === undefined ? 1 : Math.min(1, (hop.cut - t) / metrics.cutFadeMs);
}

// cost: time O(l), heap O(l), stack O(1)
// vars: l = 글 상자 줄 수
// basis: estimate
function createChip(lines, { stage, color }) {
  const { metrics } = stage;
  const chip = document.createElementNS(SVG_NS, 'g');
  const rect = document.createElementNS(SVG_NS, 'rect');
  rect.setAttribute('rx', metrics.chipRadius);
  rect.setAttribute('fill', color ?? metrics.chipFill);
  if (color) {
    rect.setAttribute('stroke', color);
    rect.setAttribute('stroke-width', metrics.chipStroke);
  }
  chip.appendChild(rect);
  const texts = lines.map((line) => createChipLine(line, chip));
  stage.packetLayer.appendChild(chip);
  const w = Math.max(...texts.map((t) => t.getComputedTextLength())) + metrics.chipPadX;
  const h = texts.length * metrics.chipLine + metrics.chipPadY;
  const top = -h - metrics.chipGap;
  rect.setAttribute('x', -w / 2);
  rect.setAttribute('y', top);
  rect.setAttribute('width', w);
  rect.setAttribute('height', h);
  texts.forEach((t, li) => t.setAttribute('y', top + metrics.chipLine * (li + 1)));
  return { g: chip, w, h };
}

// cost: time O(n), heap O(n), stack O(1)
// vars: n = 글자 수
// basis: estimate
function createChipLine(line, chip) {
  const text = document.createElementNS(SVG_NS, 'text');
  text.setAttribute('class', 'chip');
  text.append(
    ...richNodes(line, () => {
      const code = document.createElementNS(SVG_NS, 'tspan');
      code.setAttribute('class', 'code');
      return code;
    }),
  );
  chip.appendChild(text);
  return text;
}

// 브라우저에서 돈다(play.js와 한 스크립트로 이어 붙는다). 점 이동 곡선(베지어)과 글 상자 미끄러짐.

const BISECT_STEPS = 30;

// ---- 이동 곡선 ----

// cost: time O(1), heap O(1), stack O(1)
// basis: estimate
// 베지어 곡선의 한 축 값. 매개변수 t의 제어점 a, b로 구한다.
function bezierAxis(a, b, t) {
  return 3 * a * t * (1 - t) ** 2 + 3 * b * t * t * (1 - t) + t ** 3;
}

// cost: time O(STEPS), heap O(1), stack O(1)
// vars: STEPS = BISECT_STEPS
// basis: estimate
// 곡선의 한 축 값이 target이 되는 매개변수 t를 이분 탐색으로 구한다.
function solveBezier(a, b, target) {
  let [low, high] = [0, 1];
  for (let i = 0; i < BISECT_STEPS; i++) {
    const mid = (low + high) / 2;
    if (bezierAxis(a, b, mid) < target) low = mid;
    else high = mid;
  }
  return (low + high) / 2;
}

// cost: time O(STEPS), heap O(1), stack O(1)
// vars: STEPS = BISECT_STEPS
// basis: estimate
// 시간 비율 p에서 이동 곡선의 진행 비율. easing.js의 timeAt과 같은 곡선을 반대 방향으로 푼다.
function progressAt([x1, y1, x2, y2], p) {
  return bezierAxis(y1, y2, solveBezier(x1, x2, p));
}

// cost: time O(STEPS), heap O(1), stack O(1)
// vars: STEPS = BISECT_STEPS
// basis: estimate
// 진행 비율 f에 닿는 시간 비율. easing.js의 timeAt과 같다.
function timeAtProgress([x1, y1, x2, y2], f) {
  return bezierAxis(x1, x2, solveBezier(y1, y2, f));
}

// cost: time O(STEPS·k), 프레임마다 O(k), heap O(k), stack O(1)
// vars: STEPS = BISECT_STEPS, k = 경로 지점 수
// basis: estimate
// 글 상자 옮김과 불투명도. 빌드 때 시간표에 담은 경로 지점별 [진행 비율, dx, dy, opacity]를 움직이는 SVG의 SMIL(지점이 점에 닿는 시각 사이를 선형)과 같게 시간 비율 p에서 보간한다. [dx, dy, opacity]를 돌려준다.
function chipSlide(hop, metrics) {
  const path = hop.chipPath ?? [];
  const times = path.map(([at]) => timeAtProgress(metrics.move, at));
  return (p) => {
    if (!path.length) return [0, 0, 1];
    const k = times.findLastIndex((time) => time <= p);
    if (k < 0) return path[0].slice(1);
    if (k === path.length - 1) return path[k].slice(1);
    const ratio = times[k + 1] > times[k] ? (p - times[k]) / (times[k + 1] - times[k]) : 1;
    return [1, 2, 3].map((i) => path[k][i] + (path[k + 1][i] - path[k][i]) * ratio);
  };
}

// cost: time O(k), heap O(1), stack O(1)
// vars: k = 키 수
// basis: estimate
// 이동 시작 뒤 t(ms)의 글 상자 숨김 불투명도. 시간표가 한 번 계산한 키 [시각, 값]을 시간에 선형으로 읽기만 한다(src/chip-clash.js의 fadeAt과 같은 값이다). 키가 없으면 1이다.
function chipFadeAt(keys, t) {
  if (!keys?.length) return 1;
  const k = keys.findLastIndex(([at]) => at <= t);
  if (k < 0) return keys[0][1];
  if (k === keys.length - 1) return keys[k][1];
  const [[a, va], [b, vb]] = [keys[k], keys[k + 1]];
  return va + ((vb - va) * (t - a)) / (b - a);
}

// 브라우저에서 돈다(play.js와 한 스크립트로 이어 붙는다). 값 카드 줄의 값 글자와 밝힘 테두리를 시각에 맞춰 보인다.
// 시간표의 변화 목록(values)을 읽기만 한다. 글자 요소는 값마다 하나씩 미리 그려져 있고, 지금 값과 같은 글자 요소만 보인다(움직이는 SVG의 SMIL 이산 불투명도와 같은 결과).

// cost: time O(v), heap O(v), stack O(1)
// vars: v = 값 줄 수
// basis: estimate
// 값 줄마다 그림 안의 글자 요소 목록과 밝힘 테두리 요소를 한 번 찾아 둔다.
function createValueEls(svg, data) {
  return (data.values ?? []).map((_, vi) => ({ texts: [...svg.querySelectorAll(`[data-v="${vi}"]`)], frame: svg.querySelector(`[data-vf="${vi}"]`) }));
}

// cost: time O(v·(c + n)), heap O(1), stack O(1)
// vars: v = 값 줄 수, c = 값이 바뀌는 횟수, n = 값 글자 요소 수
// basis: estimate
// 그림 전체 시각 t(ms)의 값 줄을 그린다. 이 구간의 단계가 아닌 값 줄은 모두 숨기고, 단계의 값 줄은 t가 든 구간(periods)의 글을 보이고 밝힘 구간(flashes)에 들면 테두리를 밝힌다.
// 구간은 시간표가 한 번 계산한 값이고 움직이는 SVG의 SMIL 이산 불투명도와 같다.
function drawValueState(stage, seg, t) {
  stage.valueEls.forEach(({ texts, frame }, vi) => {
    const row = stage.values[vi];
    const isHere = row.si === seg.si;
    const text = (row.periods.find(([from, to]) => t >= from && t < to) ?? row.periods.at(-1))[2];
    texts.forEach((el) => el.setAttribute('opacity', isHere && el.dataset.t === text ? 1 : 0));
    frame?.setAttribute('opacity', isHere && row.flashes.some(([from, to]) => t >= from && t < to) ? 1 : 0);
  });
}

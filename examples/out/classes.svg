.fl .a7 { animation: a7 19.4s infinite step-end; }
@keyframes a8 { 0%,22.938% { fill: var(--color-muted) } 22.938%,45.876% { fill: var(--color-on-accent) } 45.876%,68.814% { fill: var(--color-on-accent) } 68.814%,99.999% { fill: var(--color-on-accent) } }

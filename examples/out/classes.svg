}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --color-accent: var(--color-blue-400);
    --color-fg: var(--color-neutral-100);
    --color-muted: var(--color-neutral-400);
    --color-bg: var(--color-neutral-900);
    --color-surface: var(--color-neutral-850);
    --color-border: var(--color-neutral-700);
    --color-card-on: var(--color-blue-900);
    --color-dot: var(--color-neutral-750);
    --color-frame: var(--color-neutral-800);
    --color-page: var(--color-neutral-950);
    --color-gallery: var(--color-neutral-950);
  }
}
[data-theme='dark'] {
  --color-accent: var(--color-blue-400);
  --color-fg: var(--color-neutral-100);
  --color-muted: var(--color-neutral-400);
  --color-bg: var(--color-neutral-900);
  --color-surface: var(--color-neutral-850);
  --color-border: var(--color-neutral-700);
  --color-card-on: var(--color-blue-900);
  --color-dot: var(--color-neutral-750);
  --color-frame: var(--color-neutral-800);
  --color-page: var(--color-neutral-950);
  --color-gallery: var(--color-neutral-950);
}
/* 그림 안 글자와 모양. HTML 재생기와 움직이는 SVG가 같이 쓴다. */
.fl text {
  font-family: var(--font-sans);
}

.fl .label {
  font-size: var(--size-text-14);
  font-weight: var(--weight-medium);
  text-anchor: middle;
  fill: var(--color-fg);
}

.fl .sub {
  font-size: var(--size-text-12);
  text-anchor: middle;
  fill: var(--color-muted);
}

.fl .frame {
  font-size: var(--size-text-11);
  font-weight: var(--weight-semibold);
  letter-spacing: var(--tracking-frame);
  fill: var(--color-muted);
}

.fl .edgelabel {
  font-family: var(--font-mono);
  font-size: var(--size-text-11);
  text-anchor: middle;
  fill: var(--color-muted);
}

.fl .row {
  font-size: var(--size-text-11);
  fill: var(--color-fg);
}

.fl .row.mono {
  font-family: var(--font-mono);
  font-size: var(--size-text-10-5);
}

.fl .muted {
  fill: var(--color-muted);
}

.fl .tag {
  font-size: var(--size-text-9);
  font-weight: var(--weight-semibold);
  letter-spacing: var(--tracking-tag);
  text-anchor: middle;
}

.fl .mark {
  font-size: var(--size-text-11);
  font-weight: var(--weight-semibold);
  text-anchor: end;
  fill: var(--color-accent);
}

.fl .mark.key {
  font-size: var(--size-text-9);
  text-anchor: start;
}

.fl .mini {
  font-size: var(--size-text-10-5);
  text-anchor: middle;
  fill: var(--color-fg);
}

.fl .mini.on {
  fill: var(--color-on-accent);
}

.fl .chip {
  font-size: var(--size-text-11-5);
  text-anchor: middle;
  fill: var(--color-on-accent);
}

.fl .md {
  font-size: var(--size-text-13);
  fill: var(--color-fg);
}

.fl .md.h {
  font-size: var(--size-text-15);
  font-weight: var(--weight-semibold);
}

.fl .cell {
  font-size: var(--size-text-11-5);
  fill: var(--color-fg);
}

.fl .cell.type {
  font-family: var(--font-mono);
  font-size: var(--size-text-10-5);
  text-anchor: end;
  fill: var(--color-muted);
}

.fl .fl-stroke {
  stroke: var(--color-border);
}

.fl .fl-path {
  fill: none;
  stroke: var(--color-muted);
  stroke-width: var(--border-edge);
}
/* 움직이는 SVG에만 있는 단계 이름과 설명 줄 */
.fl .steplabel {
  font-family: var(--font-mono);
  font-size: var(--size-text-13);
  font-weight: var(--weight-semibold);
  text-anchor: middle;
  fill: var(--color-fg);
}

.fl .caption {
  font-size: var(--size-text-13-5);
  text-anchor: middle;
  fill: var(--color-muted);
}


  :root:not([data-theme='light']) {
    --color-accent: var(--color-blue-400);
    --color-fg: var(--color-neutral-100);
    --color-muted: var(--color-neutral-400);
    --color-bg: var(--color-neutral-900);
    --color-surface: var(--color-neutral-850);
    --color-border: var(--color-neutral-700);
    --color-card-on: var(--color-blue-900);
    --color-dot: var(--color-neutral-750);
    --color-frame: var(--color-neutral-800);
    --color-page: var(--color-neutral-950);
    --color-gallery: var(--color-neutral-950);
    --color-series-2: #f08a5d;
    --color-grid: var(--color-neutral-750);
  }
}
[data-theme='dark'] {
  --color-accent: var(--color-blue-400);
  --color-fg: var(--color-neutral-100);
  --color-muted: var(--color-neutral-400);
  --color-bg: var(--color-neutral-900);
  --color-surface: var(--color-neutral-850);

/* 여러 그림을 모은 목록 쪽 */
body {
  margin: 0;
  padding: var(--space-20) var(--space-16);
  font-family: var(--font-sans);
  color: var(--color-fg);
  background: var(--color-gallery);
}

h1 {
  margin: 0 0 var(--space-3);
  font-size: var(--size-text-22);
}

body > p {
  margin: 0 0 var(--space-14);
  color: var(--color-muted);
}

main {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, var(--size-gallery-column)), 1fr));
  gap: var(--space-14);
  /* 카드를 줄에서 가장 긴 카드 높이로 늘이지 않는다. 짧은 그림 아래 빈 공간을 막기 위해서다. */
  align-items: start;
}

section {
  overflow: hidden;
  background: var(--color-bg);
  border: var(--border-thin) solid var(--color-frame);
  border-radius: var(--radius-2xl);
}

header {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: var(--space-1) var(--space-8);
  padding: var(--space-7) var(--space-9);
  border-bottom: var(--border-thin) solid var(--color-frame);
}

h2 {
  margin: 0;
  font: var(--weight-semibold) var(--size-text-14) var(--font-mono);
}

header p {
  grid-column: 1;
  margin: 0;
  font-size: var(--size-text-13);
  color: var(--color-muted);
}

nav {
  display: flex;
  grid-row: 1 / 3;
  grid-column: 2;
  gap: var(--space-5);
  align-self: center;
}

nav a {
  font-size: var(--size-text-13);
  color: var(--color-accent);
  text-decoration: none;
}

nav a:focus-visible {
  outline: var(--border-tag) solid var(--color-accent);
  outline-offset: var(--space-1);
}

iframe {
  display: block;
  width: 100%;
  height: var(--size-gallery-frame);
  border: 0;
}

<script>
// 그림 쪽이 알려 준 본문 높이로 iframe 높이를 맞춘다. 그림 아래 빈 공간을 없애기 위해서다.
addEventListener('message', (e) => {
  const frame = [...document.querySelectorAll('iframe')].find((f) => f.contentWindow === e.source);
  if (frame && e.data?.figureHeight) frame.style.height = e.data.figureHeight + 'px';
});
</script>

<rect x="168" y="307" width="208" height="12" rx="4" fill="var(--color-tag-gray)" class="chart-grow" style="animation-delay: 480ms"/><text x="382" y="317" class="chart-value" style="animation-delay: 480ms">520ms</text>
</svg>

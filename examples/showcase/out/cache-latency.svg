<rect x="168" y="207" width="376" height="12" rx="4" fill="var(--color-tag-gray)" class="chart-grow" style="animation-delay: 240ms"/><text x="550" y="217" class="chart-value" style="animation-delay: 240ms">940ms</text>
<text x="28" y="260.1" class="chart-label">POST /orders</text>

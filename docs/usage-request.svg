<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="fl" width="960" height="127" viewBox="0 0 960 127" role="img" data-scene="0" data-mode="static">
<!-- daphnis md v2 usage.md -->
<title>요청을 저장하는 경로</title>
<style>@font-face{font-family:FigSans;font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}
/* tokens/tokens.json: 생성물, 손으로 고치지 않음 */
:root {
  --color-gray-0: #ffffff;
  --color-gray-59: #f0f0f0;
  --color-gray-282: #b7b7b7;
  --color-gray-933: #111111;
  --color-blue-light-stroke: #125de6;
  --color-blue-light-ink: #0151d9;
  --color-blue-dark-stroke: #70a3ff;
  --color-blue-dark-ink: #78a9ff;
  --color-fg: var(--color-ink);
  --color-muted: var(--color-ui-muted);
  --color-group-title: var(--color-help-title-color);
  --color-node: var(--color-ui-card);
  --color-card: var(--color-ui-card);
  --color-line: var(--color-gray-282);
  --color-state-active: var(--color-blue-light-stroke);
  --color-state-active-text: var(--color-blue-light-ink);
  --color-ui-focus: var(--color-action-link);
  --color-figure-icon: var(--color-blue-light-stroke);
  --color-figure-number-fill: var(--primitive-figure-number-fill);
  --color-figure-number-ink: var(--primitive-figure-number-ink);
  --color-ui-card: var(--color-gray-0);
  --color-ink: var(--primitive-ink);
  --color-ui-muted: var(--primitive-muted);
  --color-ui-line: var(--primitive-line);
  --color-help-border: var(--primitive-help-border);
  --color-search-hover: var(--primitive-search-hover);
  --color-help-hover: var(--primitive-help-hover);
  --color-help-title-color: var(--primitive-help-title-color);
  --color-action-link: var(--primitive-link);
  --font-figure-sans: FigSans, FigSansSym, FigSansMath, ui-sans-serif, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
  --font-figure-mono: FigMono, FigSans, FigSansSym, FigSansMath, ui-monospace, SFMono-Regular, Menlo, monospace;
  --text-small-text: var(--primitive-small-text);
  --text-tiny-text: var(--primitive-tiny-text);
  --text-figure-meta: 11px;
  --tracking-text: -0.3px;
  --font-weight-semibold: 600;
  --primitive-ink: #303336;
  --primitive-muted: #55606e;
  --primitive-line: #dfe3e8;
  --primitive-link: #2576eb;
  --primitive-small-text: 15px;
  --primitive-tiny-text: 13px;
  --primitive-help-border: #ebecef;
  --primitive-search-hover: #d9e6ff;
  --primitive-help-hover: #ebf1ff;
  --primitive-help-title-color: #3d4856;
  --primitive-figure-ui-accent: #3c84f3;
  --primitive-figure-dark-node: #303136;
  --primitive-figure-dark-edge: #50535b;
  --primitive-figure-dark-separator: #454850;
  --primitive-figure-dark-hover: #343e50;
  --primitive-figure-dark-selection: #274174;
  --primitive-figure-dark-muted: #a9adb6;
  --primitive-figure-dark-line: #7f8793;
  --primitive-figure-number-fill: #303336;
  --primitive-figure-number-ink: #ffffff;
  --border-width-thin: 1px;
  --border-width-hair: 0.75px;
  --border-width-lifeline: 1.25px;
  --border-width-edge: 1.75px;
  --opacity-range: 0.4;
  --dash-gap: 4;
  --dash-card: 3;
  --outline-width-focus: 3px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']):not([data-theme='dark']) {
  --color-line: var(--primitive-figure-dark-line);
  --color-state-active: var(--primitive-figure-ui-accent);
  --color-state-active-text: var(--color-blue-dark-ink);
  --color-figure-icon: var(--color-blue-dark-stroke);
  --color-figure-number-fill: var(--color-gray-59);
  --color-figure-number-ink: var(--color-gray-933);
  --color-ui-card: var(--primitive-figure-dark-node);
  --color-ink: var(--color-gray-59);
  --color-ui-muted: var(--primitive-figure-dark-muted);
  --color-ui-line: var(--primitive-figure-dark-separator);
  --color-help-border: var(--primitive-figure-dark-edge);
  --color-search-hover: var(--primitive-figure-dark-selection);
  --color-help-hover: var(--primitive-figure-dark-hover);
  --color-help-title-color: var(--primitive-figure-dark-muted);
  color-scheme: dark;
  }
}
[data-theme='dark'] {
  --color-line: var(--primitive-figure-dark-line);
  --color-state-active: var(--primitive-figure-ui-accent);
  --color-state-active-text: var(--color-blue-dark-ink);
  --color-figure-icon: var(--color-blue-dark-stroke);
  --color-figure-number-fill: var(--color-gray-59);
  --color-figure-number-ink: var(--color-gray-933);
  --color-ui-card: var(--primitive-figure-dark-node);
  --color-ink: var(--color-gray-59);
  --color-ui-muted: var(--primitive-figure-dark-muted);
  --color-ui-line: var(--primitive-figure-dark-separator);
  --color-help-border: var(--primitive-figure-dark-edge);
  --color-search-hover: var(--primitive-figure-dark-selection);
  --color-help-hover: var(--primitive-figure-dark-hover);
  --color-help-title-color: var(--primitive-figure-dark-muted);
  color-scheme: dark;
}
[data-theme='light'] {
  --color-line: var(--color-gray-282);
  --color-state-active: var(--color-blue-light-stroke);
  --color-state-active-text: var(--color-blue-light-ink);
  --color-figure-icon: var(--color-blue-light-stroke);
  --color-figure-number-fill: var(--primitive-figure-number-fill);
  --color-figure-number-ink: var(--primitive-figure-number-ink);
  --color-ui-card: var(--color-gray-0);
  --color-ink: var(--primitive-ink);
  --color-ui-muted: var(--primitive-muted);
  --color-ui-line: var(--primitive-line);
  --color-help-border: var(--primitive-help-border);
  --color-search-hover: var(--primitive-search-hover);
  --color-help-hover: var(--primitive-help-hover);
  --color-help-title-color: var(--primitive-help-title-color);
  color-scheme: light;
}
/* 그림 안 글자와 모양. HTML 재생기와 움직이는 SVG가 같이 쓴다. */
/* 카드 안 글(label, sub, meta, cell, item, row)의 기준 점(text-anchor)은 글이 정한다(measure/texts.js의 anchor). 여기서는 글꼴과 색만 정한다. */
/* 글 위계는 셋이다: 제목(공통 디자인.label-size 15: 카드 제목은 regular, 그룹 제목은 semibold), 문장과 이름표(detail-size 13: 부제, 선 라벨, 메모, 이동 글, 카드 줄, 제약, 형식), 작은 표시(micro-size 11: 번호, 태그, 표식, 키, 눈금, 단위). 크기와 굵기는 measure/texts.js의 STYLE이 같은 토큰으로 잰다. */
.fl text {
  font-family: var(--font-figure-sans);
  letter-spacing: var(--tracking-text);
}

.fl .label {
  font-size: var(--text-small-text);
  fill: var(--color-fg);
}

.fl .sub {
  font-size: var(--text-tiny-text);
  fill: var(--color-muted);
}

.fl .frame {
  font-size: var(--text-small-text);
  font-weight: var(--font-weight-semibold);
  fill: var(--color-group-title);
}

.fl .edgelabel {
  font-size: var(--text-tiny-text);
  text-anchor: middle;
  fill: var(--fx-ink-rest);
}

/* 카드 줄, 메모와 구획 제목 같은 덧붙임 글, 관계 그래프 이름, 표 칸, 격자 칸은 문장이라 같은 크기와 글자색이다. */
.fl .row,
.fl .meta,
.fl .mini,
.fl .cell,
.fl .item {
  font-size: var(--text-tiny-text);
  fill: var(--color-fg);
}

.fl .row.mono {
  font-family: var(--font-figure-mono);
  letter-spacing: normal;
}

/* 백틱으로 감싼 글. 코드 글꼴로 그린다. */
.fl .code {
  font-family: var(--font-figure-mono);
  letter-spacing: normal;
}

.fl .muted {
  fill: var(--color-muted);
}

.fl .tag {
  font-size: var(--text-figure-meta);
  font-weight: var(--font-weight-semibold);
  fill: var(--color-fg);
}

.fl .mark {
  font-size: var(--text-figure-meta);
  font-weight: var(--font-weight-semibold);
  fill: var(--color-state-active-text);
}

/* 값 카드 줄의 값 글자. 줄의 이름(row)은 카드 층이 그리고 값은 오른쪽 끝에 얹힌다. 이름과 같은 크기이고 굵기만 다르다. */
.fl .value {
  font-size: var(--text-tiny-text);
  font-weight: var(--font-weight-semibold);
  fill: var(--color-fg);
}

.fl .chip {
  font-size: var(--text-tiny-text);
  text-anchor: middle;
}

.fl .item.gap {
  fill: var(--color-muted);
}

/* 열 형식(타입)은 코드 글이라 코드 글꼴의 오른쪽 열이다. 제약 줄(NOT NULL, ON DELETE 등)은 문장이라 일반 글꼴이다. 둘 다 이름보다 옅다. */
.fl .cell.type {
  font-family: var(--font-figure-mono);
  letter-spacing: normal;
  fill: var(--color-muted);
}

.fl .cell.rule {
  fill: var(--color-muted);
}

/* 순서 보기의 메시지, 메모, 구획, 활성 막대는 자기 장면이 보일 때만 보인다. 자리는 늘 같아 판 크기가 변하지 않는다. */
.fl .fl-off {
  display: none;
}

.fl .fl-edge {
  color: var(--fx-line-rest);
}

.fl .fl-path {
  fill: none;
  stroke: currentColor;
  stroke-width: var(--border-width-edge);
}

/* 열 키(PK, FK, UNQ)는 작은 표시이고 글자색이다. 파랑은 켜진 상태에만 쓴다. */
.fl .cell .key {
  font-size: var(--text-figure-meta);
  font-weight: var(--font-weight-semibold);
  fill: var(--color-fg);
}

/* 그룹은 면이 없다(투명). 경계와 제목만 있고, 깊이에 따라 회색 면을 겹치지 않는다. 고른 색의 면과 경계는 draw/paint.js가 쓴 색에만 더한다. */
.fl .frame-box {
  --fx-edge-rest: var(--color-line);
  fill: none;
  stroke: var(--fx-edge-rest);
  stroke-width: var(--border-width-thin);
}

.fl .lifeline {
  stroke: var(--color-line);
  stroke-width: var(--border-width-lifeline);
  stroke-dasharray: var(--dash-gap) var(--dash-gap);
}

.fl .note-box {
  fill: var(--color-node);
  stroke: var(--color-line);
  stroke-dasharray: var(--dash-card) var(--dash-card);
}

/* 알약은 모두 같은 중립 흰 면과 평소 경계다: 선 라벨, 배지와 개수. */
.fl .pill,
.fl .badge-pill {
  fill: var(--color-node);
  stroke: var(--fx-edge-rest);
}

.fl .part-bg {
  --fx-face: transparent;
  --fx-face-on: var(--fx-row);
  fill: var(--fx-face);
}

.fl .col-line {
  stroke: var(--color-ui-line);
  stroke-width: var(--border-width-hair);
}

.fl .grid-cell {
  --fx-face: var(--color-node);
  --fx-face-on: var(--fx-row);
  fill: var(--fx-face);
  stroke: var(--color-ui-line);
  stroke-width: var(--border-width-thin);
}

.fl .grid-tray {
  fill: var(--color-card);
}

.fl .grid-cell.gap {
  --fx-face: var(--color-card);
  stroke: var(--color-ui-line);
}

.fl .grid-cell.empty {
  --fx-face: none;
  stroke: var(--color-line);
  stroke-dasharray: var(--dash-card) var(--dash-card);
}

.fl .fl-edge.mark {
  --fx-line-rest: var(--color-fg);
}

/* 카드 내용 면(color.card, 테두리 없음) 위에 고른 카드 모습(face)이 옅은 면이나 경계를 더한다. */
.fl .face {
  fill: none;
  stroke: none;
}

/* 도형 윗줄과 그룹 제목 줄의 장식: 글자 배지, 아이콘 */
.fl .badge {
  font-size: var(--text-figure-meta);
  font-weight: var(--font-weight-semibold);
  text-anchor: middle;
  fill: var(--color-fg);
}

.fl .fl-icon {
  color: var(--color-figure-icon);
}

.fl .fl-symbol .fl-icon {
  color: inherit;
}

/* 선 번호 원. 흑백 번호이고 라벨 알약과 달리 켜져도 색이 바뀌지 않아 정지 그림과 같은 순서로 읽힌다. */
.fl .number-pill {
  fill: var(--color-figure-number-fill);
}

.fl .number {
  font-size: var(--text-figure-meta);
  font-weight: var(--font-weight-semibold);
  text-anchor: middle;
  fill: var(--color-figure-number-ink);
}

/* 도형은 그림자 없는 평면이다. 그림자는 떠 있는 메뉴 같은 조작에만 둔다. */
.fl :where(.fl-node) > .fl-stroke {
  stroke: var(--fx-edge-rest);
  stroke-width: var(--border-width-thin);
}

/* 구획은 border.hair, 보조 경계는 border.thin, 관계는 border.edge, 생명선은 border.lifeline, 도형 경계는 공통 디자인.node-stroke다. 모든 선은 그림과 함께 확대·축소된다. */
.fl .fl-path,
.fl .fl-node > .fl-stroke,
.fl .grid-cell,
.fl .col-line,
.fl .pill,
.fl .badge-pill {
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* 화살촉과 몸통은 같은 소유자의 색을 상속한다(draw/arrow.js). 화살촉은 채운 삼각형이다. 연결선은 선 묶음이, 차트 방향선은 역할 class(.arrow-main 등, chart.css)가 소유자다.
   HTML 문서의 차트 마커 정의는 판 SVG 밖의 정의 전용 SVG에 있어 `.fl` 아래가 아니므로 이 규칙은 `.fl` 범위를 걸지 않는다. */
.fl-arrowhead {
  fill: currentColor;
  stroke: currentColor;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* 효과 한 벌: 켜짐과 평소의 모습을 정하는 유일한 정의다. 움직이는 SVG(animate/animator.js)의 keyframes와 HTML 재생기의 `.on` 규칙이 같은 `--fx-*`를 읽으므로 두 출력과 정지 그림이 늘 같다.
   - 켜짐(on): --fx-edge 윤곽·그룹 경계·선·알약 테두리, --fx-ink 알약 글자, --fx-row 표 줄과 격자 칸의 면, --fx-face-on 요소의 켜진 면(도형은 아래), --fx-flash 값이 바뀐 순간의 면.
   - 평소(rest): --fx-edge-rest 도형, 그룹, 알약의 경계, --fx-ink-rest 알약 글자, --fx-line-rest 선, --fx-face 요소의 평소 면.
   효과는 도형이 고른 색(tone)이나 표현(appearance)과 상관없다. 고른 색은 평소 값(--fx-face, --fx-edge-rest)만 바꾸고(draw/paint.js), 켜진 동안은 강조 윤곽에 자리를 내준다. */
.fl {
  --fx-edge: var(--color-state-active);
  --fx-ink: var(--color-state-active-text);
  --fx-row: var(--color-search-hover);
  --fx-flash: var(--color-search-hover);
  --fx-edge-rest: var(--color-help-border);
  --fx-ink-rest: var(--color-muted);
  --fx-line-rest: var(--color-line);
}

/* 도형의 평소 면과 켜진 면. 옅은 면으로 고른 도형(filled)은 켜져도 면이 같다. 면이 없는 윤곽(fill='none')과 점은 자기 면이 없거나 자기 색이다. */
.fl .fl-node {
  --fx-face: var(--color-node);
  --fx-face-on: var(--color-help-hover);
}

.fl .fl-node.ap-filled {
  --fx-face-on: var(--fx-face);
}

.fl .fl-shape-start {
  --fx-face: var(--color-fg);
}

.fl .fl-node > .fl-stroke[fill='none'] {
  --fx-face: none;
  --fx-face-on: none;
}

.fl .fl-node.ap-filled > .fl-stroke:not([fill='none']) {
  fill: var(--fx-face);
}

/* `light`가 명시한 도형: 윤곽이 강조 색이 되고 면은 옅은 강조 면이다(옅은 면으로 고른 도형은 면을 그대로 둔다). 점이 닿은 도형은 도착 후광(.fl-pulse)만 쓴다. */
.fl .fl-node.on > .fl-stroke {
  stroke: var(--fx-edge);
}

.fl .fl-node.on > .fl-stroke:not([fill='none']) {
  fill: var(--fx-face-on);
}

/* `light`가 명시한 그룹: 경계선만 강조 색이다. 굵기, 면, 모서리, 점선은 그대로다. */
.fl .fl-group.on > .frame-box {
  stroke: var(--fx-edge);
}

/* 켜진 표 줄(칸)과 격자 칸의 면. 모든 카드가 같은 규칙이다. */
.fl .fl-part.on :is(.part-bg, .grid-cell) {
  fill: var(--fx-face-on);
}

/* 도형에 마우스를 올려도 면이나 선이 켜지지 않는다(장식용 호버 활성 없음). 키보드 초점은 같은 외부 형상 위의 초점 표시이고 윤곽을 두 겹으로 만들지 않는다. */
/* 브라우저 기본 초점 링은 g 요소의 사각 상자를 두르므로 둥근 도형과 어긋난다. 어떤 방식으로 초점이 가도 기본 링을 끄고, 키보드 초점(:focus-visible)은 도형 윤곽 자체로 표시한다. */
.fl .fl-node:focus,
.fl .fl-node:focus-visible {
  outline: none;
}

.fl .fl-node:focus-visible > .fl-stroke {
  stroke: var(--color-ui-focus);
  stroke-width: var(--outline-width-focus);
}

/* 값이 바뀔 때 켜지는 배경 면. 도형과 같은 윤곽을 쓰고 테두리를 더하지 않는다. */
.fl .fl-flash-face {
  fill-opacity: var(--opacity-range);
}

.fl .fl-flash {
  fill: var(--fx-flash);
  stroke: none;
  pointer-events: none;
}

@media (prefers-reduced-motion: reduce) {
  .fl .fl-flash {
    display: none;
  }
}

/* 점이 도형에 닿을 때의 테두리 후광: 도형 윤곽과 같은 모양의 겹침 선이다. 면을 칠하지 않고 선 굵기가 윤곽과 같아 도형이 커지지 않는다. 불투명도(80/80/240ms)는 SMIL이나 재생기가 정한다. */
.fl .fl-pulse {
  fill: none;
  stroke: var(--fx-edge);
  stroke-width: var(--border-width-thin);
  pointer-events: none;
}

/* 제어 구획의 경계는 관계선보다 약하며 제목 밑면은 생명선을 가린다. */
.fl .fl-fragment-border {
  fill: none;
  stroke: var(--color-ui-line);
  stroke-width: var(--border-width-thin);
}

.fl .fl-fragment-divider {
  fill: none;
  stroke: var(--color-ui-line);
  stroke-width: var(--border-width-hair);
